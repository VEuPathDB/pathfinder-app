[project]
name = "pathfinder-api"
version = "0.2.0a1"
description = "VEuPathDB Strategy Builder Chatbot API"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.44.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.14.2", # GHSA-4xgf-cpjx-pc3j
    "sqlalchemy[asyncio]>=2.0.49",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "alembic>=1.18.0",
    "httpx>=0.28.1",
    "pydantic-ai>=2.41.0,<3",
    "fastmcp-slim[server]>=3.3.0,<4",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2", # PYSEC-2026-3635
    "psycopg[binary]>=3.2.0",
    "langfuse>=4.0.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "structlog>=25.0.0",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.0",
    "numpy>=2.0.0",
    "openai>=2.0.0",
    "pyjwt>=2.13.0", # PYSEC-2026-175/177/178/179
    "slowapi>=0.1.9",
    "assistant-core[screening]",
    "cachetools>=7.0.5",
    "procrastinate>=3.8.1",
    "pydantic-evals>=2.41.0,<3",
    "veupathdb-py[otel,devtools]",
    "veupathdb-mcp",
]

[tool.uv]
# Transitive packages pip-audit reports. Each line names the advisory the
# lower bound answers, so a bound outlives the memory of why it is there.
constraint-dependencies = [
    "pyasn1>=0.6.4",  # CVE-2026-30922, PYSEC-2026-3455/3456/3457
    "aiohttp>=3.14.0",  # CVE-2026-34993, CVE-2026-47265
    "click>=8.3.3",  # PYSEC-2026-2132
    "cryptography>=50.0.0",  # PYSEC-2026-3552/3553/3554, GHSA-537c-gmf6-5ccf
    "langgraph-sdk>=0.3.15",  # PYSEC-2026-2194, PYSEC-2026-2575
    "langsmith>=0.8.18",  # GHSA-f4xh-w4cj-qxq8
    "mcp>=1.28.1,<2",  # PYSEC-2026-3481/3482/3483; the served-tools and http tests import mcp.types on the mcp 1 shapes
    "msgpack>=1.2.1",  # PYSEC-2026-3625
    "pip>=26.2",  # PYSEC-2026-3721
    "starlette>=1.3.1",  # PYSEC-2026-248, PYSEC-2026-249
    "soupsieve>=2.8.4",  # PYSEC-2026-3071, PYSEC-2026-3072
]
[tool.uv.sources]
assistant-core = { git = "https://github.com/VEuPathDB/ai-assistant-platform", subdirectory = "packages/assistant-core", tag = "v0.3.0a7" }
veupathdb-py = { git = "https://github.com/VEuPathDB/ai-veupathdb-client", tag = "v0.1.0a10" }
veupathdb-mcp = { git = "https://github.com/VEuPathDB/ai-wdk-mcp", tag = "v0.2.0a7" }
veupathdb-mcp-conformance = { git = "https://github.com/VEuPathDB/ai-assistant-platform", subdirectory = "packages/mcp-conformance", tag = "v0.3.0a7" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathfinder"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["src/pathfinder/tests"]
markers = [
    "live_wdk: tests that make live HTTP calls to VEuPathDB WDK endpoints (require network)",
    "allow_network: unit tests that are allowed to open a real network connection",
]

[tool.coverage.run]
source = ["src/pathfinder"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src", "alembic"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM",  # existing
    "A",      # builtin-shadowing (list = [], type = "foo")
    "ASYNC",  # async anti-patterns (missing await, blocking in async)
    "BLE",    # blind except (bare `except:` or `except Exception:`)
    "C90",    # McCabe complexity
    "DTZ",    # datetime without timezone
    "EM",     # string literals in exceptions
    "ERA",    # commented-out code
    "FBT",    # boolean trap (boolean positional args)
    "ICN",    # import conventions
    "ISC",    # implicit string concatenation
    "LOG",    # logging anti-patterns
    "PIE",    # misc linting
    "PT",     # pytest style enforcement
    "PTH",    # pathlib over os.path
    "RET",    # unnecessary return/else patterns
    "RSE",    # raise improvements
    "RUF",    # ruff-specific rules
    "S",      # bandit security (SQL injection, hardcoded passwords, etc.)
    "T20",    # print() statements (use structlog)
    "TCH",    # TYPE_CHECKING imports
    "TID",    # tidy imports
    "TRY",    # exception handling anti-patterns
    "PERF",   # performance anti-patterns
    "FURB",   # modernization
    "PLC",    # pylint convention
    "PLE",    # pylint error
    "PLR",    # pylint refactor
    "PLW",    # pylint warning
]
ignore = [
    # FastAPI path params and Pydantic field names intentionally use mixedCase
    # to match the public HTTP contract (e.g. `siteId`, `planSessionId`).
    # Long prompt/template strings intentionally exceed line-length.
    "E501",
    "N803",
    "N815",
    # Pydantic models with self-referential fields need quoted forward refs
    # even on Python 3.14 (PEP 649) because Pydantic's metaclass evaluates
    # annotations eagerly at class construction time.
    "UP037",
    # We don't use TYPE_CHECKING imports.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-returns = 6
max-branches = 10

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",     # assert is what tests do
    "S105",     # hardcoded passwords in test fixtures are fine
    "S106",     # hardcoded password args in test fixtures are fine
    "PLR2004",  # magic values in assertions are expected
    "FBT",      # boolean args in test helpers are fine
    "S311",     # deterministic seeds for shuffling is fine
]
"**/src/pathfinder/ai/prompts/**" = [
    "E501",  # prompt strings are long by nature
]
"**/scripts/**" = [
    "T20",    # scripts use print() for CLI output
    "S101",   # assert in scripts is fine
]
"**/src/pathfinder/ai/tools/standalone/**" = [
    "PLR0913",  # tool functions need many params for LLM tool interface
    "FBT",      # boolean params required for LLM tool descriptions
]
"**/src/pathfinder/jobs/impls/**" = [
    "PLR0913",  # worker impls mirror tool signatures + framework kwargs
    "FBT",      # booleans mirror tool interface
]
"**/src/pathfinder/devtools/**" = [
    "T20",      # devtools scripts use print() for CLI output
    "C901",     # stream analysis inspects many event types
    "PLR0912",  # branching inherent to multi-event-type parsing
    "PLR0915",  # statement count naturally high for CLI tools
    "PLR2004",  # magic values in CLI thresholds are fine
]

[tool.ruff.lint.isort]
known-first-party = ["pathfinder"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disable_error_code = ["import-untyped", "untyped-decorator"]
exclude = ["scripts/", "docs/"]

[tool.pydantic-mypy]
init_typed = false

[tool.vulture]
paths = ["src/pathfinder"]
exclude = ["tests/", "*/conftest.py"]
min_confidence = 80
# Ruff TC006 requires the type expression in cast() to be a string. Vulture does
# not resolve string annotations, so it reads every such import as unused.
ignore_names = ["CursorResult"]

[dependency-groups]
dev = [
    "hypothesis>=6.151.0",
    # The suite reads an installed distribution's own requirement specifiers.
    "packaging>=25.0",
    "import-linter>=2.11",
    "mypy>=2.3.1",
    "pyright>=1.1.408",
    "pip-audit>=2.10.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "respx>=0.22.0",
    "ruff>=0.16.6",
    "testcontainers>=4.14.0",
    "vulture>=2.16",
    "schemathesis>=4.16.1",
    # The conformance lane asks the canonical form whether a union has a complement.
    "jsonschema-rs>=0.55.0",
    # The served endpoint's admission run composes the suite as its own process.
    "veupathdb-mcp-conformance",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=8.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-inline-tabs>=2025.12.21.14",
    "sphinxcontrib-mermaid>=2.0.1",
]


# ---------------------------------------------------------------------------
# Import Linter — backend architecture enforcement
# ---------------------------------------------------------------------------
[tool.importlinter]
# The three installed distributions are root packages, not external ones: a
# forbidden contract cannot name a submodule of an external package, so a
# private module of a library is only reachable by the checker this way.
root_packages = ["pathfinder", "veupathdb", "veupathdb_mcp", "assistant_core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Transport and AI never import persistence directly"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "pathfinder.transport",
    "pathfinder.ai",
]
forbidden_modules = ["pathfinder.persistence"]

[[tool.importlinter.contracts]]
name = "Services never import transport or AI"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["pathfinder.services"]
forbidden_modules = [
    "pathfinder.transport",
    "pathfinder.ai",
    "pydantic_ai",
]

[[tool.importlinter.contracts]]
name = "Persistence never imports services, transport, or AI"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["pathfinder.persistence"]
forbidden_modules = [
    "pathfinder.services",
    "pathfinder.transport",
    "pathfinder.ai",
]

# The runtime is the `assistant-core` distribution, so no contract here can
# reach it. Its own suite walks its modules; its pyproject names no dependency
# on this application. What stays enforceable here is the direction of the
# assembly: an assistant is built FROM the science, never the other way, so a
# science module that reaches the composition root has inverted the wiring.
# Direct-only, like the three above: the chat dispatcher still reaches the
# registry through the job runner, which is the turn-pipeline seam WS3 named.
[[tool.importlinter.contracts]]
name = "The science never imports an assistant's composition root"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "pathfinder.ai",
    "pathfinder.persistence",
    "pathfinder.services",
]
forbidden_modules = ["pathfinder.assistants"]

# The workbench is one module: gene sets, experiments, control sets, variant
# comparisons and parameter sweeps. `services/workbench/` is its facade, and it
# holds functions with bodies, not re-export lines. What is forbidden below is
# every module whose behaviour the facade owns; a result type stays importable
# from the module that defines it, because a facade that re-exports a type is a
# re-export. Direct-only, like the four above.
[[tool.importlinter.contracts]]
name = "The agent and the jobs reach the workbench only through its facade"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "pathfinder.ai",
    "pathfinder.jobs",
]
forbidden_modules = [
    "pathfinder.services.control_sets",
    "pathfinder.services.experiment.control_sourcing",
    "pathfinder.services.experiment.store",
    "pathfinder.services.gene_sets.enrichment",
    "pathfinder.services.gene_sets.store",
    "pathfinder.services.parameter_optimization.sweep",
]


# A distribution's public surface is what its package exports. A private module
# and a module behind a package surface are both that distribution's own
# business: either may be renamed or deleted in any release, and this
# application pins each library by tag, so an import of one turns a library
# refactor into an outage here. The tool server publishes every name it means a
# host to read on one of its packages, so every module of it that is not one of
# those packages is named below. The list is explicit because import-linter
# matches whole segments only; a module a library adds is named here in the
# release that takes it.
[[tool.importlinter.contracts]]
name = "The application imports no module a distribution does not publish"
type = "forbidden"
as_packages = true
allow_indirect_imports = true
source_modules = ["pathfinder"]
forbidden_modules = [
    "veupathdb.wdk._analyses",
