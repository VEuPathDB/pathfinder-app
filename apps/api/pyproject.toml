# Cleared as each library publishes the name the test needs. An exception that
# no longer matches fails this gate, so a stale line cannot survive. Two shapes
# stand here: a test that patches an attribute of a library module needs the
# module object, and `catalog.radio_pairs` is a function whose name is also a
# module, so the package attribute reads as the deep module to the checker.
ignore_imports = [
    "pathfinder.ai.tools.standalone._frame_proposals -> veupathdb_mcp.catalog.radio_pairs",
    # The one test-support seam: serve_search_details patches validate_parameters
    # through its own module globals, which the package surface cannot reach.
    "pathfinder.tests._support.catalog_builders -> veupathdb_mcp.catalog.param_validation",
    "pathfinder.tests.integration.ai._organism_swap_wire -> veupathdb_mcp.catalog.param_discovery",
    "pathfinder.tests.integration.ai._organism_swap_wire -> veupathdb_mcp.catalog.searches",
    "pathfinder.tests.integration.durable.test_geneset_enrichment_durable -> veupathdb_mcp.wdk.enrichment.service",
    "pathfinder.tests.unit.ai.tools.conftest -> veupathdb_mcp.catalog.search_inspection",
    "pathfinder.tests.unit.ai.tools.test_ai_expression_tool -> veupathdb_mcp.wdk.ai_expression",
    "pathfinder.tests.unit.ai.tools.test_catalog -> veupathdb_mcp.catalog.searches",
    "pathfinder.tests.unit.ai.tools.test_catalog_discovery -> veupathdb_mcp.catalog.search_inspection",
    "pathfinder.tests.unit.ai.tools.test_catalog_discovery -> veupathdb_mcp.catalog.searches",
    "pathfinder.tests.unit.ai.tools.test_catalog_discovery_gate -> veupathdb_mcp.catalog.search_inspection",
    "pathfinder.tests.unit.ai.tools.test_catalog_discovery_gate -> veupathdb_mcp.catalog.searches",
    "pathfinder.tests.unit.ai.tools.test_catalog_discovery_options -> veupathdb_mcp.catalog.search_inspection",
    "pathfinder.tests.unit.ai.tools.test_frame_spec -> veupathdb_mcp.catalog.search_inspection",
    "pathfinder.tests.unit.ai.tools.test_frame_spec -> veupathdb_mcp.catalog.searches",
    "pathfinder.tests.unit.ai.tools.test_frame_spec_defaults -> veupathdb_mcp.catalog.searches",
    "pathfinder.tests.unit.ai.tools.test_frame_spec_params -> veupathdb_mcp.catalog.param_discovery",
    "pathfinder.tests.unit.ai.tools.test_public_strategy_search -> veupathdb_mcp.tools.catalog_tools",
]
