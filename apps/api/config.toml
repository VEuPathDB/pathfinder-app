api_env = "development"
api_host = "0.0.0.0"
api_port = 8000
api_debug = false
api_docs_enabled = true

database_url = "postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder"

veupathdb_default_site = "veupathdb"
veupathdb_oauth_url = ""

log_level = "INFO"
log_format = "json"

cors_origins = ["http://localhost:3000"]
cors_origin_regex = "^https?://(localhost|127\\.0\\.0\\.1)(:\\d+)?$"
