[project]
name = "veupathdb-py"
version = "0.1.0a1"
description = "Python client for the VEuPathDB WDK and EDA services"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12.0",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "tenacity>=9.1.0",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
    "json5>=0.14.0",
    "structlog>=25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veupathdb"]

[tool.hatch.build.targets.wheel.force-include]
"src/veupathdb/sites.yaml" = "veupathdb/sites.yaml"

[dependency-groups]
# The two schema readers are the devtools' own: `veupathdb.devtools` verifies the
# recorded bodies against the vendored WDK and EDA schemas, and nothing the
# client sends or parses at runtime reads them.
dev = [
    "cryptography>=50.0.0",
    "hypothesis>=6.151.0",
    "jsonschema>=4.26.0",
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "referencing>=0.37.0",
    "respx>=0.22.0",
    "ruff==0.15.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src", "."]
consider_namespace_packages = true
addopts = "-m 'not live_wdk and not wheel' --import-mode=importlib"
markers = [
    "live_wdk: one call to a running VEuPathDB site (opt-in; run via `uv run pytest tests/live -m live_wdk --override-ini addopts=''`)",
    "wheel: builds and installs the wheel (opt-in; run via `uv run pytest tests/packaging -m wheel --override-ini addopts=''`)",
]

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "W", "UP", "B", "C4", "SIM",
    "A", "ASYNC", "BLE", "C90", "DTZ", "EM", "ERA", "FBT", "ICN", "ISC", "LOG",
    "PIE", "PT", "PTH", "RET", "RSE", "RUF", "S", "T20", "TCH", "TID", "TRY",
    "PERF", "FURB", "PLC", "PLE", "PLR", "PLW",
]
ignore = [
    "E501",
    "N803",
    "N815",
    # Pydantic models with self-referential fields need quoted forward refs
    # even on Python 3.14 (PEP 649) because Pydantic's metaclass evaluates
    # annotations eagerly at class construction time.
    "UP037",
    # We don't use TYPE_CHECKING imports.
    "TC001", "TC002", "TC003",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 6
max-returns = 6
max-branches = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "PLR2004",
    "FBT",
    "S311",
]
"src/veupathdb/devtools/**" = [
    "T20",      # the devtools commands print their result
    "C901",
    "PLR0912",
    "PLR0915",
    "PLR2004",
]

[tool.ruff.lint.isort]
known-first-party = ["veupathdb"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
disable_error_code = ["import-untyped", "untyped-decorator"]
exclude = ["tests/"]

[tool.pydantic-mypy]
init_typed = false

[tool.pyright]
pythonVersion = "3.14"
pythonPlatform = "Linux"
