name: Setup Web
description: Enable Corepack, set up Node + Yarn cache, install both projects' deps, generate shared types.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "24.13.0"

runs:
  using: composite
  steps:
    # Corepack before setup-node so the cache step uses Yarn 4, not global Yarn 1.x.
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "yarn"
        cache-dependency-path: yarn.lock

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable

    # shared-ts generated types are gitignored; every web job resolves them from source.
    - name: Generate shared types
      shell: bash
      run: yarn --cwd packages/shared-ts generate
