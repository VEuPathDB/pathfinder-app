name: Setup Web
description: Enable Corepack, set up Node + Yarn cache, install dependencies, generate shared types.

inputs:
  node-version:
    description: Node.js version.
    required: false
    default: "24.13.0"

runs:
  using: composite
  steps:
    # Corepack before setup-node so the cache step uses Yarn 4, not global Yarn 1.x.
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Restore node_modules
      id: modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          apps/web/node_modules
          packages/shared-ts/node_modules
          .yarn/install-state.gz
        key: node-modules-${{ runner.os }}-${{ inputs.node-version }}-${{ hashFiles('yarn.lock', '.yarnrc.yml', 'package.json', 'apps/web/package.json', 'packages/shared-ts/package.json') }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.modules.outputs.cache-hit != 'true' && 'yarn' || '' }}
        cache-dependency-path: yarn.lock

    - name: Install dependencies
      if: ${{ steps.modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: yarn install --immutable

    # shared-ts generated types are gitignored; every web job resolves them from source.
    - name: Generate shared types
      shell: bash
      run: yarn --cwd packages/shared-ts generate
