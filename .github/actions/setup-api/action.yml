name: Setup API
description: Set up Python + uv and sync API dependencies.

inputs:
  python-version:
    description: Python version.
    required: false
    default: "3.14"
  sync-args:
    description: Extra args for `uv sync` (e.g. --group docs).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "0.12.10"

    - name: Restore the virtual environment
      id: venv
      uses: actions/cache@v4
      with:
        path: apps/api/.venv
        key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ hashFiles('apps/api/uv.lock') }}-${{ inputs.sync-args }}

    - name: Install API dependencies
      shell: bash
      working-directory: apps/api
      env:
        COMPILE: ${{ steps.venv.outputs.cache-hit != 'true' && '--compile-bytecode' || '' }}
      run: uv sync $COMPILE ${{ inputs.sync-args }}
