name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      # Code scanning accepts uploads only on public repositories or with
      # Advanced Security, so a private repository fails the job on findings
      # instead of uploading them.
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ !github.event.repository.private }}
        with:
          sarif_file: "trivy-results.sarif"

      - name: Fail on findings
        uses: aquasecurity/trivy-action@master
        if: ${{ github.event.repository.private }}
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          # Lob excluded: its pattern is `(live|test)_[a-zA-Z0-9_]{35}` with no
          # vendor keyword, so every 40-char pytest name matches, and its verifier
          # counts a 403 from api.lob.com as a live key. We have no Lob integration.
          extra_args: --only-verified --exclude-detectors=Lob

  codeql:
    name: CodeQL Analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      # Both languages are interpreted, so the analysis reads the source with no build.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # Every analysis on main caches its database. Only the newest of each kind is
  # read again, so the older ones are deleted to keep the cache under its limit.
  codeql-cache:
    name: Prune CodeQL caches
    runs-on: ubuntu-latest
    needs: codeql
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: write
    steps:
      - name: Delete all but the newest CodeQL database of each kind
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key codeql-overlay-base-database- \
            --sort created_at --order desc --limit 200 --json id,key \
            | jq -r 'reduce .[] as $c ({seen: {}, drop: []};
                ($c.key | split("-") | .[:-4] | join("-")) as $g
                | if .seen[$g] then .drop += [$c.id] else .seen[$g] = true end) | .drop[]' \
            | xargs -r -n 1 gh cache delete --repo "$GITHUB_REPOSITORY"
