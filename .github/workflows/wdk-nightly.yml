name: WDK nightly

# The live half of the science lane. It never blocks a pull request: a failure
# opens an issue, and a confirmed drift is answered by re-recording the pinned
# fixtures the per-PR lane reads.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: wdk-nightly
  cancel-in-progress: false

jobs:
  live-lane:
    name: WDK live lane
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.lane.outcome }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Run the live lane
        id: lane
        continue-on-error: true
        working-directory: apps/api
        env:
          API_ENV: test
          API_SECRET_KEY: wdk-nightly-secret-key-000000000000
          PATHFINDER_CHAT_PROVIDER: mock
          WDK_TEST_EMAIL: ${{ secrets.WDK_TEST_EMAIL }}
          WDK_TEST_PASSWORD: ${{ secrets.WDK_TEST_PASSWORD }}
          VEUPATHDB_AUTH_TOKEN: ${{ secrets.VEUPATHDB_AUTH_TOKEN }}
          WDK_LIVE_SUMMARY: wdk-live-summary.json
          WDK_HIDDEN_DEFAULTS_REPORT: wdk-hidden-defaults.json
        run: uv run pytest src/pathfinder/tests -m live_wdk -q

      - name: Show the drift the run measured
        if: always()
        working-directory: apps/api
        run: |
          test -f wdk-live-summary.json || { echo "no summary written"; exit 0; }
          python -c "import json,sys; s=json.load(open('wdk-live-summary.json')); print(json.dumps({'outcomes': s['outcomes'], 'sites': s['sites'], 'drift': s['drift']}, indent=2))"

      - name: Upload the run's summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdk-live-summary
          path: |
            apps/api/wdk-live-summary.json
            apps/api/wdk-hidden-defaults.json
          if-no-files-found: warn

      - name: Open an issue when the lane fails
        if: steps.lane.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "WDK nightly lane failed";
            const body = [
              "The live WDK lane failed on " + new Date().toISOString().slice(0, 10) + ".",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                context.repo.repo + "/actions/runs/" + context.runId,
              "",
              "The `wdk-live-summary` artifact names every measurement and the drift list.",
              "A confirmed drift is answered by re-recording the pinned fixtures:",
              "`cd apps/api && uv run python -m veupathdb.devtools.fixtures record`.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "wdk-drift",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["wdk-drift"],
            });
