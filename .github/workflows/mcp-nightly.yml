name: MCP nightly

# The admission lane. It never blocks a pull request: an admitted source is
# re-read on a schedule and quarantined by an issue when it stops conforming.
# It targets the container this repository serves, and no public VEuPathDB site
# beyond the account reads the WDK nightly already makes.
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: mcp-nightly
  cancel-in-progress: false

jobs:
  admission-lane:
    name: veupathdb-wdk-mcp admission lane
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.lane.outcome }}
    # One case in the lane verifies a bearer the way the app does, which reads
    # the application's own database.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Serve the MCP endpoint
        env:
          API_ENV: test
          API_SECRET_KEY: mcp-nightly-secret-key-0000000000000
          PATHFINDER_CHAT_PROVIDER: mock
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder_test
          VEUPATHDB_AUTH_TOKEN: ${{ secrets.VEUPATHDB_AUTH_TOKEN }}
          WDK_MCP_BASE_URL: http://localhost:8100
          WDK_MCP_SERVICE_TOKENS: ${{ secrets.PATHFINDER_MCP_SERVICE_TOKENS }}
        working-directory: apps/api
        run: |
          test -n "$WDK_MCP_SERVICE_TOKENS" || {
            echo "no service token configured; the lane has nothing to admit"
            exit 0
          }
          # A user bearer names an internal user, so the schema must exist first.
          uv run python -c "import asyncio; from pathfinder.platform.migrations import init_db; asyncio.run(init_db())"
          uv run python -m veupathdb_mcp &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8100/health && exit 0
            sleep 2
          done
          echo "the served endpoint did not answer /health"
          exit 1

      - name: Read the served endpoint with the conformance suite
        id: lane
        continue-on-error: true
        working-directory: apps/api
        env:
          API_ENV: test
          API_SECRET_KEY: mcp-nightly-secret-key-0000000000000
          PATHFINDER_CHAT_PROVIDER: mock
          WDK_TEST_EMAIL: ${{ secrets.WDK_TEST_EMAIL }}
          WDK_TEST_PASSWORD: ${{ secrets.WDK_TEST_PASSWORD }}
          VEUPATHDB_AUTH_TOKEN: ${{ secrets.VEUPATHDB_AUTH_TOKEN }}
          WDK_MCP_SERVICE_TOKENS: ${{ secrets.PATHFINDER_MCP_SERVICE_TOKENS }}
          PATHFINDER_MCP_URL: http://localhost:8100/mcp
          MCP_ADMISSION_REPORT: mcp-admission-report.json
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder_test
        run: uv run pytest src/pathfinder/tests/integration/mcp -m live_wdk -q

      - name: Show what the run admitted
        if: always()
        working-directory: apps/api
        run: |
          test -f mcp-admission-report.json || { echo "no report written"; exit 0; }
          python -c "import json; r=json.load(open('mcp-admission-report.json')); print(json.dumps({'verdict': r['verdict'], 'server': r['server']['serverInfo'], 'families': [{k: f[k] for k in ('id','passed','failed','skipped')} for f in r['families']]}, indent=2))"

      - name: Upload the admission report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-admission-report
          path: apps/api/mcp-admission-report.json
          if-no-files-found: warn

      - name: Open an issue when the lane fails
        if: steps.lane.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "MCP admission lane failed";
            const body = [
              "The served veupathdb-wdk-mcp endpoint stopped conforming on " +
                new Date().toISOString().slice(0, 10) + ".",
              "",
              "Run: " + context.serverUrl + "/" + context.repo.owner + "/" +
                context.repo.repo + "/actions/runs/" + context.runId,
              "",
              "The `mcp-admission-report` artifact names every family and every check.",
              "A source that fails its families is quarantined until the report is green:",
              "an admission is a report a human read, not a build that went green once.",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "mcp-conformance",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["mcp-conformance"],
            });
