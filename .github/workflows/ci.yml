name: CI

on:
  push:
    branches: [main, develop, pydantic-ai]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      assistant_core: ${{ steps.filter.outputs.assistant_core }}
      assistant_client: ${{ steps.filter.outputs.assistant_client }}
      mcp_conformance: ${{ steps.filter.outputs.mcp_conformance }}
      web: ${{ steps.filter.outputs.web }}
      knowledge: ${{ steps.filter.outputs.knowledge }}
      wdk: ${{ steps.filter.outputs.wdk }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/assistant-core/**'
            assistant_core:
              - 'packages/assistant-core/**'
            mcp_conformance:
              - 'packages/mcp-conformance/**'
            # The client is built from the protocol document, so a change to
            # that page runs the consumer-side conformance suite.
            assistant_client:
              - 'packages/assistant-client-ts/**'
              - 'packages/assistant-core/PROTOCOL.md'
            web:
              - 'apps/web/**'
              - 'packages/shared-ts/**'
              - 'packages/assistant-client-ts/**'
            knowledge:
              - 'docs/knowledge/**'
              - 'scripts/check-knowledge.mjs'
              - 'scripts/check-knowledge.test.mjs'
              - 'scripts/__fixtures__/knowledge/**'
            # Anchors and test ids resolve against the repo root, so a move
            # anywhere in these trees can break a rule without touching a doc.
            wdk:
              - 'docs/**'
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'

  check-knowledge:
    name: Check knowledge bundle
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.knowledge == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # Zero dependencies by design, so the runner's node is enough.
      - name: Check OKF conformance
        run: node scripts/check-knowledge.mjs
      - name: Check the checker
        run: node --test scripts/check-knowledge.test.mjs

  check-wdk-rules:
    name: Check WDK rules
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.wdk == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check rule conformance
        run: node scripts/check-wdk-rules.mjs
      - name: Check the checker
        run: node --test scripts/check-wdk-rules.test.mjs

  assistant-core:
    name: Assistant runtime package
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.assistant_core == 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7

      # No `pathfinder` is installed in this environment. That is the point:
      # the suite passing here is the boundary, not a linter rule about it.
      - name: Install the package alone
        working-directory: packages/assistant-core
        run: uv sync

      - name: Run ruff
        working-directory: packages/assistant-core
        run: uv run ruff check src tests

      - name: Check formatting
        working-directory: packages/assistant-core
        run: uv run ruff format --check src tests

      - name: Run mypy
        working-directory: packages/assistant-core
        run: uv run mypy --strict src

      - name: Run tests
        working-directory: packages/assistant-core
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder_test
        run: uv run pytest

  mcp-conformance:
    name: MCP conformance suite
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.mcp_conformance == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7

      # Nothing of this deployment is installed here: the suite is run by teams
      # whose servers we did not write, and a test walks every module to prove it.
      - name: Install the package alone
        working-directory: packages/mcp-conformance
        run: uv sync

      - name: Run ruff
        working-directory: packages/mcp-conformance
        run: uv run ruff check src tests

      - name: Run mypy
        working-directory: packages/mcp-conformance
        run: uv run mypy --strict src

      - name: Run tests
        working-directory: packages/mcp-conformance
        run: uv run pytest

  assistant-client:
    name: Assistant client package
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.assistant_client == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Type check
        working-directory: packages/assistant-client-ts
        run: yarn typecheck

      - name: Run ESLint
        working-directory: packages/assistant-client-ts
        run: yarn lint

      - name: Check formatting
        working-directory: packages/assistant-client-ts
        run: yarn format:check

      # The suite is the protocol's consumer side: it fails when the vendored
      # capture and PROTOCOL.md disagree, and when a kind the document defines
      # has no reducer.
      - name: Run conformance tests
        working-directory: packages/assistant-client-ts
        run: yarn test

      # The published artifact is JS and declarations under dist/, which the
      # repository itself never resolves: only this step reads it.
      - name: Build the package
        working-directory: packages/assistant-client-ts
        run: yarn build

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Run ruff
        working-directory: apps/api
        run: uv run ruff check .

      - name: Check formatting
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Run mypy
        working-directory: apps/api
        run: uv run mypy src

      - name: Run pyright
        working-directory: apps/api
        run: uv run pyright src/pathfinder

      - name: Check import-linter contracts
        working-directory: apps/api
        run: uv run lint-imports

      - name: Check for dead code
        working-directory: apps/api
        run: uv run vulture

      - name: Check test assertion strength
        working-directory: apps/api
        run: uv run python scripts/check_weak_assertions.py

      - name: Check file sizes
        working-directory: apps/api
        run: uv run python scripts/check_max_lines.py

      - name: Audit dependencies
        working-directory: apps/api
        run: uv run pip-audit

      # Spec is the canonical (production) surface: non-mock so dev-only routes are excluded.
      - name: Check OpenAPI spec is up to date
        working-directory: apps/api
        env:
          API_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder
          API_SECRET_KEY: spec-generation-secret-key-0000000000
          PATHFINDER_CHAT_PROVIDER: default
          ANTHROPIC_API_KEY: spec-generation-placeholder
        run: uv run python -m pathfinder.devtools.openapi check

  build-docs:
    name: Build API docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
        with:
          sync-args: --group docs

      - name: Build Sphinx docs
        working-directory: apps/api
        run: uv run sphinx-build -b html docs docs/_build/html

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Run tests
        working-directory: apps/api
        env:
          API_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder_test
          API_SECRET_KEY: test-secret-key-xxxxx-xxxxx-xxxxx
          PATHFINDER_CHAT_PROVIDER: mock
        run: uv run pytest --cov=src --cov-report=xml --cov-fail-under=40

  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Run ESLint
        working-directory: apps/web
        run: yarn lint

      - name: Check formatting
        working-directory: apps/web
        run: yarn format:check

      - name: Type check
        working-directory: apps/web
        run: yarn typecheck

      - name: Check architectural boundaries
        working-directory: apps/web
        run: yarn check:boundaries

      # Both ratchets are green on the trunk, so a red line here names a test
      # added without a value assertion or an index-based locator.
      - name: Check test assertion strength
        working-directory: apps/web
        run: yarn check:weak-assertions

      - name: Check the checker
        working-directory: apps/web
        run: node --test scripts/check-weak-assertions.test.mjs

      - name: Check for index-based Playwright locators
        working-directory: apps/web
        run: yarn check:strict-mode

  check-shared-ts:
    name: Check shared TS types
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Check generated types are up to date
        working-directory: packages/shared-ts
        run: yarn check:generated

      - name: Check formatting
        working-directory: packages/shared-ts
        run: yarn format:check

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Run unit tests (with coverage)
        working-directory: apps/web
        run: yarn test:coverage

  test-e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Full-stack; runs on api or web changes, after web lint+test (skip-safe).
    needs: [changes, lint-web, test-web]
    if: >-
      ${{ !cancelled()
        && needs.lint-web.result != 'failure'
        && needs.test-web.result != 'failure'
        && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') }}
    steps:
      - uses: actions/checkout@v4

      # Self-contained test env; secret is generated per run, never committed.
      - name: Prepare e2e env
        run: |
          cat > .env.test <<'EOF'
          API_ENV=test
          PATHFINDER_CHAT_PROVIDER=mock
          NEXT_PUBLIC_API_URL=http://api:8000
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/pathfinder
          DEFAULT_PROVIDER=anthropic
          DEFAULT_TIER=balanced
          EOF
          printf 'API_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env.test

      - name: Build + start the stack (mock provider, test env)
        run: |
          docker compose --env-file .env.test \
            -f docker-compose.yml -f docker-compose.e2e.yml \
            up -d --build api web worker

      - name: Wait for API + web
        run: |
          ok=
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1 && { ok=1; break; }
            sleep 5
          done
          [ -n "$ok" ] || { echo "API not ready"; docker compose --env-file .env.test -f docker-compose.yml -f docker-compose.e2e.yml logs api | tail -80; exit 1; }
          ok=
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/ >/dev/null 2>&1 && { ok=1; break; }
            sleep 2
          done
          [ -n "$ok" ] || { echo "web not ready"; docker compose --env-file .env.test -f docker-compose.yml -f docker-compose.e2e.yml logs web | tail -50; exit 1; }

      - uses: ./.github/actions/setup-web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: yarn playwright install --with-deps

      - name: Run Playwright tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: yarn test:e2e

      - name: Stack logs on failure
        if: failure()
        run: docker compose --env-file .env.test -f docker-compose.yml -f docker-compose.e2e.yml logs --tail=120

      - name: Tear down
        if: always()
        run: |
          docker compose --env-file .env.test \
            -f docker-compose.yml -f docker-compose.e2e.yml down -v

  # Make this the single required status check (skipped jobs aren't failures).
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - assistant-core
      - assistant-client
      - check-knowledge
      - check-wdk-rules
      - mcp-conformance
      - lint-api
      - build-docs
      - test-api
      - lint-web
      - check-shared-ts
      - test-web
      - test-e2e
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs succeeded or were skipped."
