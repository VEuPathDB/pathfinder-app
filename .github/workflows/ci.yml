name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The full-stack tier runs on every pull request and once a night on main;
  # a push to main runs the unit and lint tiers only.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The e2e shard count, and the sites every turn-driving test runs on.
env:
  E2E_SHARDS: 10
  E2E_SITES: plasmodb,vectorbase

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # A scheduled or hand-started run has no diff to filter, so it runs everything.
    outputs:
      api: ${{ steps.filter.outputs.api == 'true' || steps.filter.outcome == 'skipped' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.filter.outcome == 'skipped' }}
      knowledge: ${{ steps.filter.outputs.knowledge == 'true' || steps.filter.outcome == 'skipped' }}
      wdk: ${{ steps.filter.outputs.wdk == 'true' || steps.filter.outcome == 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
              - 'packages/shared-ts/**'
            knowledge:
              - 'docs/knowledge/**'
              - 'scripts/check-knowledge.mjs'
              - 'scripts/check-knowledge.test.mjs'
              - 'scripts/__fixtures__/knowledge/**'
            # Anchors and test ids resolve against the repo root, so a move
            # anywhere in these trees can break a rule without touching a doc.
            wdk:
              - 'docs/**'
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'

  check-knowledge:
    name: Check knowledge bundle
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.knowledge == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # Zero dependencies by design, so the runner's node is enough.
      - name: Check OKF conformance
        run: node scripts/check-knowledge.mjs
      - name: Check the checker
        run: node --test scripts/check-knowledge.test.mjs

  check-punctuation:
    name: Check punctuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Zero dependencies by design, so the runner's node is enough.
      - name: Check source punctuation
        run: node scripts/check-punctuation.mjs
      - name: Check the checker
        run: node --test scripts/check-punctuation.test.mjs

  check-vocabulary:
    name: Check vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checker parses the web source with the web app's own TypeScript.
      - uses: ./.github/actions/setup-web
      - name: Check one name per concept
        run: node scripts/check-vocabulary.mjs
      - name: Check the checker
        run: node --test scripts/check-vocabulary.test.mjs

  check-quadlets:
    name: Check deployment units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Zero dependencies by design, so the runner's node is enough.
      - name: Check the quadlet units
        run: node scripts/check-quadlets.mjs
      - name: Check the checker
        run: node --test scripts/check-quadlets.test.mjs

  check-wdk-rules:
    name: Check WDK rules
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.wdk == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check rule conformance
        run: node scripts/check-wdk-rules.mjs
      - name: Check the checker
        run: node --test scripts/check-wdk-rules.test.mjs

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Run ruff
        working-directory: apps/api
        run: uv run ruff check .

      - name: Check formatting
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Run mypy
        working-directory: apps/api
        run: uv run mypy src

      - name: Run pyright
        working-directory: apps/api
        run: uv run pyright src/pathfinder

      - name: Check import-linter contracts
        working-directory: apps/api
        run: uv run lint-imports

      - name: Check for dead code
        working-directory: apps/api
        run: uv run vulture

      - name: Check test assertion strength
        working-directory: apps/api
        run: uv run python scripts/check_weak_assertions.py

      - name: Check file sizes
        working-directory: apps/api
        run: uv run python scripts/check_max_lines.py

      - name: Audit dependencies
        working-directory: apps/api
        run: uv run pip-audit

      # Spec is the canonical (production) surface: non-mock so dev-only routes are excluded.
      - name: Check OpenAPI spec is up to date
        working-directory: apps/api
        env:
          API_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder
          API_SECRET_KEY: spec-generation-secret-key-0000000000
          PATHFINDER_CHAT_PROVIDER: default
          ANTHROPIC_API_KEY: spec-generation-placeholder
        run: uv run python -m pathfinder.devtools.openapi check

  build-docs:
    name: Build API docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
        with:
          sync-args: --group docs

      - name: Build Sphinx docs
        working-directory: apps/api
        run: uv run sphinx-build -b html docs docs/_build/html

  test-api:
    name: Test API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pathfinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      # A push to main runs the unit tier; a pull request, the nightly run and
      # a hand-started run add the integration tier on top.
      - name: Run tests
        working-directory: apps/api
        env:
          API_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/pathfinder_test
          API_SECRET_KEY: test-secret-key-xxxxx-xxxxx-xxxxx
          PATHFINDER_CHAT_PROVIDER: mock
          TEST_TIER: ${{ github.event_name == 'push' && 'src/pathfinder/tests/unit' || 'src/pathfinder/tests' }}
        run: uv run pytest "$TEST_TIER" --cov=src --cov-report=xml --cov-fail-under=40

  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Run ESLint
        working-directory: apps/web
        run: yarn lint

      - name: Check formatting
        working-directory: apps/web
        run: yarn format:check

      - name: Type check
        working-directory: apps/web
        run: yarn typecheck

      - name: Check architectural boundaries
        working-directory: apps/web
        run: yarn check:boundaries

      - name: Check the boundary checker
        working-directory: apps/web
        run: node --test scripts/check-boundaries.test.mjs

      - name: Check the trace redaction
        working-directory: apps/web
        run: node --test scripts/redact-traces.test.mjs

      # Both ratchets are green on the trunk, so a red line here names a test
      # added without a value assertion or an index-based locator.
      - name: Check test assertion strength
        working-directory: apps/web
        run: yarn check:weak-assertions

      - name: Check the checker
        working-directory: apps/web
        run: node --test scripts/check-weak-assertions.test.mjs

      - name: Check for index-based Playwright locators
        working-directory: apps/web
        run: yarn check:strict-mode

  check-shared-ts:
    name: Check shared TS types
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Check the committed spec generates types that compile
        working-directory: packages/shared-ts
        run: yarn check:generated

      - name: Check formatting
        working-directory: packages/shared-ts
        run: yarn format:check

  test-web:
    name: Test Web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Run unit tests (with coverage)
        working-directory: apps/web
        run: yarn test:coverage

  # The full-stack tier builds once, runs E2E_SHARDS shards at two Playwright
  # workers each and merges their reports. A push to main does not run it: the
  # pull request that landed the change already did.
  e2e-build:
    name: E2E build
    runs-on: ubuntu-latest
    needs: [changes, lint-web, test-web]
    if: >-
      ${{ !cancelled()
        && github.event_name != 'push'
        && needs.lint-web.result != 'failure'
        && needs.test-web.result != 'failure'
        && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The worker runs the api image, so two builds serve the three services.
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: pathfinder-e2e-api:ci
          push: false
          outputs: type=docker,dest=/tmp/pathfinder-api.tar
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,scope=e2e-api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          build-args: NEXT_PUBLIC_API_URL=http://api:8000
          tags: pathfinder-e2e-web:ci
          push: false
          outputs: type=docker,dest=/tmp/pathfinder-web.tar
          cache-from: type=gha,scope=e2e-web
          cache-to: type=gha,scope=e2e-web,mode=max

      # The image layers are gzip already, so the artifact stores them as they are.
      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: e2e-images
          path: |
            /tmp/pathfinder-api.tar
            /tmp/pathfinder-web.tar
          retention-days: 1
          compression-level: 0

  e2e-shard-check:
    name: E2E shards cover the suite
    runs-on: ubuntu-latest
    needs: [changes, lint-web, test-web]
    if: >-
      ${{ !cancelled()
        && github.event_name != 'push'
        && needs.lint-web.result != 'failure'
        && needs.test-web.result != 'failure'
        && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') }}
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      # A test the shards drop never runs, and a test two shards hold runs twice.
      - name: Check every test is in exactly one shard
        working-directory: apps/web
        run: |
          set -o pipefail
          export LC_ALL=C
          tests() { yarn playwright test --list --reporter=list "$@" | grep -E '^  \[' | sort; }
          tests > "$RUNNER_TEMP/unsharded.txt"
          for i in $(seq 1 "$E2E_SHARDS"); do tests --shard "$i/$E2E_SHARDS"; done | sort > "$RUNNER_TEMP/sharded.txt"
          total=$(wc -l < "$RUNNER_TEMP/unsharded.txt")
          [ "$total" -gt 0 ] || { echo "::error::playwright listed no tests"; exit 1; }
          if ! cmp -s "$RUNNER_TEMP/unsharded.txt" "$RUNNER_TEMP/sharded.txt"; then
            echo "::error::The $E2E_SHARDS shards do not run every test exactly once."
            comm -3 "$RUNNER_TEMP/unsharded.txt" "$RUNNER_TEMP/sharded.txt"
            exit 1
          fi
          echo "$total tests, each in exactly one of $E2E_SHARDS shards"

      - name: Name the shards
        id: shards
        run: echo "list=$(jq -cn --argjson n "$E2E_SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [e2e-build, e2e-shard-check]
    # An explicit condition, so a skipped web lint or test upstream does not skip the shards.
    if: ${{ !cancelled() && needs.e2e-build.result == 'success' && needs.e2e-shard-check.result == 'success' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-shard-check.outputs.shards) }}
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images

      - name: Load the images
        run: |
          docker load -i "$RUNNER_TEMP/e2e-images/pathfinder-api.tar"
          docker load -i "$RUNNER_TEMP/e2e-images/pathfinder-web.tar"

      # Self-contained test env; secret is generated per run, never committed.
      # Compose interpolates the whole file, so SEARXNG_SECRET needs a value
      # even though this stack starts only api, web and worker.
      - name: Prepare e2e env
        run: |
          cat > .env.test <<'EOF'
          API_ENV=test
          PATHFINDER_CHAT_PROVIDER=mock
          NEXT_PUBLIC_API_URL=http://api:8000
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/pathfinder
          DEFAULT_PROVIDER=anthropic
          DEFAULT_TIER=balanced
          EOF
          printf 'API_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env.test
          printf 'SEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env.test

      # The stack boots while the next two steps install the browsers; the
      # wait step reads how the bring-up ended.
      - name: Start the stack
        run: |
          (
            status=0
            docker compose --env-file .env.test up -d --no-build --wait --wait-timeout 300 api web worker || status=$?
            echo "$status" > "$RUNNER_TEMP/stack-up.status"
          ) > "$RUNNER_TEMP/stack-up.log" 2>&1 &

      - uses: ./.github/actions/setup-web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: yarn playwright install --with-deps

      - name: Wait for the stack
        timeout-minutes: 6
        run: |
          until [ -s "$RUNNER_TEMP/stack-up.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/stack-up.log"
          exit "$(cat "$RUNNER_TEMP/stack-up.status")"

      # The suite acts as a registered VEuPathDB account; global setup signs
      # in with these and exports the token the fixtures read.
      - name: Run Playwright tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          WDK_TEST_EMAIL: ${{ secrets.WDK_TEST_EMAIL }}
          WDK_TEST_PASSWORD: ${{ secrets.WDK_TEST_PASSWORD }}
          SHARD: ${{ matrix.shard }}
        run: yarn playwright test --shard "$SHARD/$E2E_SHARDS" --reporter=blob

      # A trace records request headers and typed values, so every VEuPathDB
      # token and the account's email and password leave the blob before upload.
      - name: Redact the account from the blob report
        id: redact
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          WDK_TEST_EMAIL: ${{ secrets.WDK_TEST_EMAIL }}
          WDK_TEST_PASSWORD: ${{ secrets.WDK_TEST_PASSWORD }}
        run: node scripts/redact-traces.mjs blob-report

      # The blob holds every failed test's trace and snapshot for the merged report.
      - name: Upload the blob report
        if: ${{ !cancelled() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1
          if-no-files-found: ignore

      # COMPOSE_FILE names the overlay set the bring-up used, so a stack that
      # dies before Playwright starts still prints why.
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.test ps -a
          for c in api worker web db; do
            docker inspect --format "$c: {{json .State}}" "pathfinder-app-$c-1" || true
          done
          free -m
          df -h /
          docker compose --env-file .env.test logs --no-color api worker web db

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.test down -v

  e2e-merge-report:
    name: E2E report
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ !cancelled() && needs.e2e-shard.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Download the blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: apps/web/all-blob-reports

      - name: Merge the reports
        working-directory: apps/web
        run: yarn playwright merge-reports --reporter html,github ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Fail when a shard failed
        if: ${{ needs.e2e-shard.result == 'failure' }}
        run: |
          echo "::error::At least one e2e shard failed; the playwright-report artifact names the tests."
          exit 1

  # Make this the single required status check (skipped jobs aren't failures).
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - check-knowledge
      - check-punctuation
      - check-vocabulary
      - check-quadlets
      - check-wdk-rules
      - lint-api
      - build-docs
      - test-api
      - lint-web
      - check-shared-ts
      - test-web
      - e2e-build
      - e2e-shard-check
      - e2e-shard
      - e2e-merge-report
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs succeeded or were skipped."
