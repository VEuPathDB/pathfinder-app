name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  # Every job reads recorded or replayed responses; none reaches a live site
  # or a model. A hand-started run also refreshes the recorded test durations;
  # nothing runs on a schedule.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The e2e shard count, and the sites every turn-driving test runs on.
env:
  E2E_SHARDS: 16
  E2E_SITES: plasmodb,vectorbase

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    # A hand-started run has no diff to filter, so it runs everything.
    outputs:
      api: ${{ steps.filter.outputs.api == 'true' || steps.filter.outcome == 'skipped' }}
      web: ${{ steps.filter.outputs.web == 'true' || steps.filter.outcome == 'skipped' }}
      knowledge: ${{ steps.filter.outputs.knowledge == 'true' || steps.filter.outcome == 'skipped' }}
      wdk: ${{ steps.filter.outputs.wdk == 'true' || steps.filter.outcome == 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        with:
          filters: |
            api:
              - 'apps/api/**'
            web:
              - 'apps/web/**'
              - 'packages/shared-ts/**'
            knowledge:
              - 'docs/knowledge/**'
              - 'scripts/check-knowledge.mjs'
              - 'scripts/check-knowledge.test.mjs'
              - 'scripts/__fixtures__/knowledge/**'
            # Anchors and test ids resolve against the repo root, so a move
            # anywhere in these trees can break a rule without touching a doc.
            wdk:
              - 'docs/**'
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'

  check-knowledge:
    name: Check knowledge bundle
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.knowledge == 'true' }}
    steps:
      - uses: actions/checkout@v4
      # Zero dependencies by design, so the runner's node is enough.
      - name: Check OKF conformance
        run: node scripts/check-knowledge.mjs
      - name: Check the checker
        run: node --test scripts/check-knowledge.test.mjs

  check-punctuation:
    name: Check punctuation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Zero dependencies by design, so the runner's node is enough.
      - name: Check source punctuation
        run: node scripts/check-punctuation.mjs
      - name: Check the checker
        run: node --test scripts/check-punctuation.test.mjs

  check-vocabulary:
    name: Check vocabulary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checker parses the web source with the web app's own TypeScript.
      - uses: ./.github/actions/setup-web
      - name: Check one name per concept
        run: node scripts/check-vocabulary.mjs
      - name: Check the checker
        run: node --test scripts/check-vocabulary.test.mjs

  check-test-sites:
    name: Check test sites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every test path names only QA sites
        run: node scripts/check-test-sites.mjs
      - name: Check the checker
        run: node --test scripts/check-test-sites.test.mjs

  check-release:
    name: Check release pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the api version and the MCP pins
        run: node scripts/check-release.mjs
      - name: Check the tag names the api version
        if: ${{ github.ref_type == 'tag' }}
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Check the checker
        run: node --test scripts/check-release.test.mjs scripts/release.test.mjs

  check-pre-push:
    name: Check the pre-push runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the runner reads the hook stages
        run: node --test scripts/pre-push.test.mjs

  check-wdk-rules:
    name: Check WDK rules
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.wdk == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check rule conformance
        run: node scripts/check-wdk-rules.mjs
      - name: Check the checker
        run: node --test scripts/check-wdk-rules.test.mjs

  lint-api-mypy:
    name: Lint API (mypy)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Restore the mypy cache
        uses: actions/cache@v4
        with:
          path: apps/api/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('apps/api/uv.lock') }}-

      - name: Run mypy
        working-directory: apps/api
        run: uv run mypy src

  lint-api-pyright:
    name: Lint API (pyright)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Run pyright
        working-directory: apps/api
        run: uv run pyright src/strategist

  lint-api:
    name: Lint API
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Run ruff
        working-directory: apps/api
        run: uv run ruff check .

      - name: Check formatting
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Check import-linter contracts
        working-directory: apps/api
        run: uv run lint-imports

      - name: Check for dead code
        working-directory: apps/api
        run: uv run vulture

      - name: Check test assertion strength
        working-directory: apps/api
        run: uv run python scripts/check_weak_assertions.py

      - name: Check file sizes
        working-directory: apps/api
        run: uv run python scripts/check_max_lines.py

      - name: Check parameter comparisons
        working-directory: apps/api
        run: uv run python -m veupathdb.devtools.param_equality src --allow scripts/param-equality-allowed.txt

      - name: Audit dependencies
        working-directory: apps/api
        run: uv run pip-audit

      # Spec is the canonical (production) surface: non-mock so dev-only routes are excluded.
      - name: Check OpenAPI spec is up to date
        working-directory: apps/api
        env:
          API_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/strategist
          API_SECRET_KEY: spec-generation-secret-key-0000000000
          STRATEGIST_CHAT_PROVIDER: default
          ANTHROPIC_API_KEY: spec-generation-placeholder
          OPENAI_API_KEY: spec-generation-placeholder
          VEUPATHDB_SITES_CONFIG: ${{ github.workspace }}/deploy/sites/qa.yml
        run: uv run python -m strategist.devtools.openapi check

  build-docs:
    name: Build API docs
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api
        with:
          sync-args: --group docs

      - name: Build Sphinx docs
        working-directory: apps/api
        run: uv run sphinx-build -b html docs docs/_build/html

  # Both tiers run on every push, split by recorded duration.
  test-api:
    name: Test API (unit ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Run tests
        working-directory: apps/api
        env:
          API_ENV: test
          API_SECRET_KEY: test-secret-key-xxxxx-xxxxx-xxxxx
          STRATEGIST_CHAT_PROVIDER: mock
          GROUP: ${{ matrix.group }}
          STORE: ${{ github.event_name == 'workflow_dispatch' && '--store-durations' || '' }}
        run: >-
          uv run pytest src/strategist/tests/unit -m "not live_model and not live_wdk"
          --splits 3 --group "$GROUP" --durations-path .test_durations
          --splitting-algorithm least_duration
          -n auto --durations=25 --cov=src --cov-report= ${STORE:+"$STORE"}

      - name: Upload the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-unit-${{ matrix.group }}
          path: apps/api/.coverage
          retention-days: 1
          include-hidden-files: true

      - name: Upload the recorded durations
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: durations-unit-${{ matrix.group }}
          path: apps/api/.test_durations
          retention-days: 1
          include-hidden-files: true

  test-api-integration:
    name: Test API (integration ${{ matrix.group }}/8)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: strategist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Run tests
        working-directory: apps/api
        env:
          API_ENV: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/strategist_test
          API_SECRET_KEY: test-secret-key-xxxxx-xxxxx-xxxxx
          STRATEGIST_CHAT_PROVIDER: mock
          GROUP: ${{ matrix.group }}
          STORE: ${{ github.event_name == 'workflow_dispatch' && '--store-durations' || '' }}
        run: >-
          uv run pytest src/strategist/tests/integration -m "not live_model and not live_wdk"
          --splits 8 --group "$GROUP" --durations-path .test_durations
          --splitting-algorithm least_duration
          -n auto --durations=25 --cov=src --cov-report= ${STORE:+"$STORE"}

      - name: Upload the coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api-integration-${{ matrix.group }}
          path: apps/api/.coverage
          retention-days: 1
          include-hidden-files: true

      - name: Upload the recorded durations
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: durations-integration-${{ matrix.group }}
          path: apps/api/.test_durations
          retention-days: 1
          include-hidden-files: true

  test-api-groups:
    name: API groups cover the suite
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Check every test is in exactly one group
        working-directory: apps/api
        env:
        run: |
          set -o pipefail
          export LC_ALL=C
          collect() {
            tier="$1"; out="$2"; shift 2
            uv run pytest "src/strategist/tests/$tier" -m "not live_model and not live_wdk" --collect-only -q "$@" | grep '::' | sort > "$out"
          }
          check() {
            tier="$1"; groups="$2"; dir="$RUNNER_TEMP/$tier"
            mkdir -p "$dir"
            pids=()
            collect "$tier" "$dir/whole.txt" & pids+=($!)
            for g in $(seq 1 "$groups"); do
              collect "$tier" "$dir/group-$g.txt" --splits "$groups" --group "$g" --durations-path .test_durations --splitting-algorithm least_duration & pids+=($!)
            done
            for p in "${pids[@]}"; do wait "$p"; done
            sort "$dir"/group-*.txt > "$dir/grouped.txt"
            total=$(wc -l < "$dir/whole.txt")
            [ "$total" -gt 0 ] || { echo "::error::pytest collected no $tier tests"; exit 1; }
            if ! cmp -s "$dir/whole.txt" "$dir/grouped.txt"; then
              echo "::error::The $groups $tier groups do not run every test exactly once."
              comm -3 "$dir/whole.txt" "$dir/grouped.txt"
              exit 1
            fi
            echo "$total $tier tests, each in exactly one of $groups groups"
          }
          check unit 3
          check integration 8

  test-api-durations:
    name: Refresh the API test durations
    runs-on: ubuntu-latest
    needs: [test-api, test-api-integration]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.test-api.result == 'success' && needs.test-api-integration.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the recorded durations
        uses: actions/download-artifact@v4
        with:
          pattern: durations-*
          path: ${{ runner.temp }}/durations

      - name: Merge the durations each group recorded
        working-directory: apps/api
        run: |
          python3 - "$RUNNER_TEMP/durations" <<'PY'
          import json, pathlib, sys
          committed = json.loads(pathlib.Path(".test_durations").read_text())
          merged = dict(committed)
          for recorded in pathlib.Path(sys.argv[1]).glob("*/.test_durations"):
              for test, seconds in json.loads(recorded.read_text()).items():
                  if committed.get(test) != seconds:
                      merged[test] = seconds
          pathlib.Path(".test_durations").write_text(json.dumps(dict(sorted(merged.items())), indent=4) + "\n")
          print(f"{sum(merged.get(t) != committed.get(t) for t in merged)} of {len(merged)} durations changed")
          PY

      - name: Upload the merged durations
        uses: actions/upload-artifact@v4
        with:
          name: test-durations
          path: apps/api/.test_durations
          retention-days: 14
          include-hidden-files: true

  test-api-coverage:
    name: Test API coverage
    runs-on: ubuntu-latest
    needs: [test-api, test-api-integration]
    if: ${{ !cancelled() && needs.test-api.result == 'success' && needs.test-api-integration.result != 'failure' && needs.test-api-integration.result != 'cancelled' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-api

      - name: Download the coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-api-*
          path: ${{ runner.temp }}/coverage

      - name: Combine and check coverage
        working-directory: apps/api
        run: |
          for d in "$RUNNER_TEMP"/coverage/*/; do cp "$d/.coverage" ".coverage.$(basename "$d")"; done
          uv run coverage combine
          uv run coverage report --fail-under=40 --format=total
          uv run coverage xml

  lint-web:
    name: Lint Web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Run ESLint
        working-directory: apps/web
        run: yarn lint

      - name: Check formatting
        working-directory: apps/web
        run: yarn format:check

      - name: Type check
        working-directory: apps/web
        run: yarn typecheck

      - name: Check architectural boundaries
        working-directory: apps/web
        run: yarn check:boundaries

      - name: Check the boundary checker
        working-directory: apps/web
        run: node --test scripts/check-boundaries.test.mjs

      - name: Check the trace redaction
        working-directory: apps/web
        run: node --test scripts/redact-traces.test.mjs

      # Both ratchets are green on the trunk, so a red line here names a test
      # added without a value assertion or an index-based locator.
      - name: Check test assertion strength
        working-directory: apps/web
        run: yarn check:weak-assertions

      - name: Check the checker
        working-directory: apps/web
        run: node --test scripts/check-weak-assertions.test.mjs

      - name: Check for index-based Playwright locators
        working-directory: apps/web
        run: yarn check:strict-mode

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Restore the Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('apps/web/src/**', 'packages/shared-ts/src/**', 'packages/spec/**') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-

      - name: Build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: yarn build

  check-shared-ts:
    name: Check shared TS types
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Check the committed spec generates types that compile
        working-directory: packages/shared-ts
        run: yarn check:generated

      - name: Check formatting
        working-directory: packages/shared-ts
        run: yarn format:check

  test-web:
    name: Test Web (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Run unit tests (with coverage)
        working-directory: apps/web
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          yarn vitest run --shard="$SHARD/6" --reporter=default --reporter=blob
          --coverage --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.branches=0 --coverage.thresholds.functions=0

      - name: Upload the blob report
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: apps/web/.vitest/blob
          retention-days: 1
          include-hidden-files: true

  test-web-coverage:
    name: Test Web coverage
    runs-on: ubuntu-latest
    needs: test-web
    if: ${{ !cancelled() && needs.test-web.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Download the blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: apps/web/.vitest/blob

      - name: Merge the shards and check coverage
        working-directory: apps/web
        run: yarn vitest run --merge-reports --coverage

  # The full-stack tier builds once, runs E2E_SHARDS shards at two Playwright
  # workers each and merges their reports. A push to main does not run it: the
  # pull request that landed the change already did. It reaches live sites, so
  # E2E_ENABLED stays off until it runs on replayed recordings
  # (docs/superpowers/specs/2026-11-23-e2e-replays-recorded-wdk.md).
  e2e-build:
    name: E2E build
    runs-on: ubuntu-latest
    needs: [changes, lint-web, test-web]
    if: >-
      ${{ !cancelled()
        && vars.E2E_ENABLED == 'true'
        && github.event_name != 'push'
        && needs.lint-web.result != 'failure'
        && needs.test-web.result != 'failure'
        && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The worker runs the api image, so two builds serve the three services.
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: strategist-e2e-api:ci
          push: false
          outputs: type=docker,dest=/tmp/strategist-api.tar
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,scope=e2e-api,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          build-args: NEXT_PUBLIC_API_URL=http://api:8000
          tags: strategist-e2e-web:ci
          push: false
          outputs: type=docker,dest=/tmp/strategist-web.tar
          cache-from: type=gha,scope=e2e-web
          cache-to: type=gha,scope=e2e-web,mode=max

      # The image layers are gzip already, so the artifact stores them as they are.
      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: e2e-images
          path: |
            /tmp/strategist-api.tar
            /tmp/strategist-web.tar
          retention-days: 1
          compression-level: 0

  e2e-shard-check:
    name: E2E shards cover the suite
    runs-on: ubuntu-latest
    needs: [changes, lint-web, test-web]
    if: >-
      ${{ !cancelled()
        && vars.E2E_ENABLED == 'true'
        && github.event_name != 'push'
        && needs.lint-web.result != 'failure'
        && needs.test-web.result != 'failure'
        && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true') }}
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      # A test the shards drop never runs, and a test two shards hold runs twice.
      - name: Check every test is in exactly one shard
        working-directory: apps/web
        run: |
          set -o pipefail
          export LC_ALL=C
          tests() { yarn playwright test --list --reporter=list "$@" | grep -E '^  \[' | sort; }
          tests > "$RUNNER_TEMP/unsharded.txt"
          for i in $(seq 1 "$E2E_SHARDS"); do tests --shard "$i/$E2E_SHARDS"; done | sort > "$RUNNER_TEMP/sharded.txt"
          total=$(wc -l < "$RUNNER_TEMP/unsharded.txt")
          [ "$total" -gt 0 ] || { echo "::error::playwright listed no tests"; exit 1; }
          if ! cmp -s "$RUNNER_TEMP/unsharded.txt" "$RUNNER_TEMP/sharded.txt"; then
            echo "::error::The $E2E_SHARDS shards do not run every test exactly once."
            comm -3 "$RUNNER_TEMP/unsharded.txt" "$RUNNER_TEMP/sharded.txt"
            exit 1
          fi
          echo "$total tests, each in exactly one of $E2E_SHARDS shards"

      - name: Name the shards
        id: shards
        run: echo "list=$(jq -cn --argjson n "$E2E_SHARDS" '[range(1; $n + 1)]')" >> "$GITHUB_OUTPUT"

  e2e-shard:
    name: E2E shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [e2e-build, e2e-shard-check]
    # An explicit condition, so a skipped web lint or test upstream does not skip the shards.
    if: ${{ !cancelled() && needs.e2e-build.result == 'success' && needs.e2e-shard-check.result == 'success' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.e2e-shard-check.outputs.shards) }}
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v4

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images

      - name: Load the images
        run: |
          docker load -i "$RUNNER_TEMP/e2e-images/strategist-api.tar"
          docker load -i "$RUNNER_TEMP/e2e-images/strategist-web.tar"

      # Self-contained test env; secret is generated per run, never committed.
      # Compose interpolates the whole file, so SEARXNG_SECRET needs a value
      # even though this stack starts only api, web and worker.
      - name: Prepare e2e env
        run: |
          cat > .env.test <<'EOF'
          API_ENV=test
          STRATEGIST_CHAT_PROVIDER=mock
          NEXT_PUBLIC_API_URL=http://api:8000
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/strategist
          DEFAULT_PROVIDER=anthropic
          DEFAULT_TIER=balanced
          OPENAI_API_KEY=sk-e2e-not-a-key
          EOF
          printf 'API_SECRET_KEY=%s\n' "$(openssl rand -hex 32)" >> .env.test
          printf 'SEARXNG_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env.test

      # The stack boots while the next two steps install the browsers; the
      # wait step reads how the bring-up ended.
      - name: Start the stack
        run: |
          (
            status=0
            docker compose --env-file .env.test up -d --no-build api web worker || status=$?
            echo "$status" > "$RUNNER_TEMP/stack-up.status"
          ) > "$RUNNER_TEMP/stack-up.log" 2>&1 &

      - uses: ./.github/actions/setup-web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: yarn playwright install --with-deps

      # Compose's `--wait` refuses the worker, which has no healthcheck and
      # serves no HTTP, so readiness is read from the api: its own ready view,
      # the web root, and the worker's heartbeat.
      - name: Wait for the stack
        timeout-minutes: 8
        run: |
          until [ -s "$RUNNER_TEMP/stack-up.status" ]; do sleep 2; done
          cat "$RUNNER_TEMP/stack-up.log"
          status="$(cat "$RUNNER_TEMP/stack-up.status")"
          [ "$status" = 0 ] || exit "$status"
          ready=
          for _ in $(seq 1 90); do
            if curl -fsS http://localhost:8000/health/ready > /dev/null 2>&1 \
              && curl -fsS http://localhost:3000/strategist/ > /dev/null 2>&1 \
              && curl -fsS http://localhost:8000/health/system | jq -e '.workerAlive == true' > /dev/null 2>&1; then
              ready=1; break
            fi
            sleep 4
          done
          [ -n "$ready" ] && exit 0
          echo "the stack did not become ready"
          docker compose --env-file .env.test ps -a
          docker compose --env-file .env.test logs --no-color api worker web | tail -120
          exit 1

      # The suite acts as a registered VEuPathDB account; global setup signs
      # in with these and exports the token the fixtures read.
      - name: Run Playwright tests
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          WDK_TEST_EMAIL: ${{ secrets.WDK_TEST_EMAIL }}
          WDK_TEST_PASSWORD: ${{ secrets.WDK_TEST_PASSWORD }}
          SHARD: ${{ matrix.shard }}
        run: yarn playwright test --shard "$SHARD/$E2E_SHARDS" --reporter=blob

      # A trace records request headers and typed values, so every VEuPathDB
      # token and the account's email and password leave the blob before upload.
      - name: Redact the account from the blob report
        id: redact
        if: ${{ !cancelled() }}
        working-directory: apps/web
        env:
          WDK_TEST_EMAIL: ${{ secrets.WDK_TEST_EMAIL }}
          WDK_TEST_PASSWORD: ${{ secrets.WDK_TEST_PASSWORD }}
        run: node scripts/redact-traces.mjs blob-report

      # The blob holds every failed test's trace and snapshot for the merged report.
      - name: Upload the blob report
        if: ${{ !cancelled() && steps.redact.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: apps/web/blob-report
          retention-days: 1
          if-no-files-found: ignore

      # COMPOSE_FILE names the overlay set the bring-up used, so a stack that
      # dies before Playwright starts still prints why.
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.test ps -a
          for c in api worker web db; do
            docker inspect --format "$c: {{json .State}}" "pathfinder-app-$c-1" || true
          done
          free -m
          df -h /
          docker compose --env-file .env.test logs --no-color api worker web db

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.test down -v

  e2e-merge-report:
    name: E2E report
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: ${{ !cancelled() && needs.e2e-shard.result != 'skipped' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-web

      - name: Download the blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: apps/web/all-blob-reports

      - name: Merge the reports
        working-directory: apps/web
        run: yarn playwright merge-reports --reporter html,github ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: Fail when a shard failed
        if: ${{ needs.e2e-shard.result == 'failure' }}
        run: |
          echo "::error::At least one e2e shard failed; the playwright-report artifact names the tests."
          exit 1

  # Make this the single required status check (skipped jobs aren't failures).
  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - check-knowledge
      - check-punctuation
      - check-vocabulary
      - check-test-sites
      - check-release
      - check-pre-push
      - check-wdk-rules
      - lint-api
      - lint-api-mypy
      - lint-api-pyright
      - build-docs
      - test-api
      - test-api-integration
      - test-api-groups
      - test-api-coverage
      - lint-web
      - build-web
      - check-shared-ts
      - test-web
      - test-web-coverage
      - e2e-build
      - e2e-shard-check
      - e2e-shard
      - e2e-merge-report
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs succeeded or were skipped."
