services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      API_ENV: ${API_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PATHFINDER_CHAT_PROVIDER: ${PATHFINDER_CHAT_PROVIDER:?Set PATHFINDER_CHAT_PROVIDER=default for real providers or use the test overlay for mock mode}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-anthropic}
      DEFAULT_TIER: ${DEFAULT_TIER:-balanced}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      S2_API_KEY: ${S2_API_KEY:-}
      VEUPATHDB_SITES_CONFIG: ${VEUPATHDB_SITES_CONFIG:-}
      VEUPATHDB_AUTH_TOKEN: ${VEUPATHDB_AUTH_TOKEN:-}
      VEUPATHDB_OAUTH_URL: ${VEUPATHDB_OAUTH_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      # Accounted megabytes of per-site catalogs and semantic indexes one
      # process holds before the least recently used site is evicted.
      SITE_CATALOG_BUDGET_MB: ${SITE_CATALOG_BUDGET_MB:-512}
      # Budget for one site's catalog load, and the gap between two passes over
      # the sites that did not load. A site that misses the budget is degraded.
      SITE_PRELOAD_TIMEOUT_SECONDS: ${SITE_PRELOAD_TIMEOUT_SECONDS:-30}
      SITE_RETRY_INTERVAL_SECONDS: ${SITE_RETRY_INTERVAL_SECONDS:-60}
      # The directory the three services exchange catalog snapshots through.
      CATALOG_CACHE_DIR: /app/data/catalogs
      # This is the process that syncs the embedding indexes.
      EMBEDDING_INDEX_SYNC_ENABLED: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      # Set PIGUARD_ENABLED=false to skip the prompt-injection model load + per-message scan.
      PIGUARD_ENABLED: ${PIGUARD_ENABLED:-true}
      # Set OTEL_INCLUDE_CONTENT=true to export prompts and completions in agent traces.
      OTEL_INCLUDE_CONTENT: ${OTEL_INCLUDE_CONTENT:-false}
      # Seconds of silence after which the chat SSE stream sends a comment frame.
      SSE_KEEPALIVE_SECONDS: ${SSE_KEEPALIVE_SECONDS:-15}
      # Silence after which a worker counts as dead and its turn is failed.
      # The heartbeat runs in a thread of its own, so a running job cannot
      # widen the gap this has to clear.
      WORKER_DEAD_HEARTBEAT_SECONDS: ${WORKER_DEAD_HEARTBEAT_SECONDS:-60}
      # Dev WDK login for the chat debugger (pathfinder.devtools.chat); set in .env.dev.
      WDK_DEV_EMAIL: ${WDK_DEV_EMAIL:-}
      WDK_DEV_PASSWORD: ${WDK_DEV_PASSWORD:-}
      # The veupathdb-wdk-mcp endpoint an assistant's declaration resolves to,
      # and the credential presented there. Set the same secret in this
      # deployment's WDK_MCP_SERVICE_TOKENS; an empty one admits nothing.
      PATHFINDER_WDK_MCP_URL: ${PATHFINDER_WDK_MCP_URL:-http://wdk-mcp:8100/mcp}
      PATHFINDER_WDK_MCP_TOKEN: ${PATHFINDER_WDK_MCP_TOKEN:-}
      # The veupathdb-research-mcp endpoint and its credential. An empty token
      # admits no research source, and the turn runs without those tools.
      PATHFINDER_RESEARCH_MCP_URL: ${PATHFINDER_RESEARCH_MCP_URL:-http://research-mcp:8110/mcp}
      PATHFINDER_RESEARCH_MCP_TOKEN: ${PATHFINDER_RESEARCH_MCP_TOKEN:-}
      # Every process that writes or matches a helper strategy reads the same
      # prefix. A process on the library default recognises none of them.
      VEUPATHDB_INTERNAL_STRATEGY_NAME_PREFIX: ${VEUPATHDB_INTERNAL_STRATEGY_NAME_PREFIX:-__pathfinder_internal__:}
    volumes:
      # Devtools chat-debugger run artifacts (pathfinder.devtools.chat) land on
      # the host so they can be inspected outside the container.
      - ./apps/api/.pf-runs:/data/pf-runs
      # Per-site catalog snapshots. Without this every recreate serves the
      # image's snapshots, finds them stale, and refetches and re-encodes.
      - catalogs_cache:/app/data/catalogs

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: .venv/bin/python -m pathfinder.jobs.worker
    # The worker shares the API image but serves no HTTP, so curl cannot check it.
    # restart covers the boot window before the API applies the DB schema, and
    # any later crash of the worker loop.
    restart: unless-stopped
    # The catalog budget bounds the growers inside the process; the ceiling is
    # the backstop, and a kill lands on the worker, which restarts clean.
    mem_limit: 2g
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      API_ENV: ${API_ENV:-production}
      API_SECRET_KEY: ${API_SECRET_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PATHFINDER_CHAT_PROVIDER: ${PATHFINDER_CHAT_PROVIDER:?Set PATHFINDER_CHAT_PROVIDER=default for real providers or use the test overlay for mock mode}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-anthropic}
      DEFAULT_TIER: ${DEFAULT_TIER:-balanced}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      S2_API_KEY: ${S2_API_KEY:-}
      VEUPATHDB_SITES_CONFIG: ${VEUPATHDB_SITES_CONFIG:-}
      VEUPATHDB_AUTH_TOKEN: ${VEUPATHDB_AUTH_TOKEN:-}
      VEUPATHDB_OAUTH_URL: ${VEUPATHDB_OAUTH_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      # Accounted megabytes of per-site catalogs and semantic indexes one
      # process holds before the least recently used site is evicted.
      SITE_CATALOG_BUDGET_MB: ${SITE_CATALOG_BUDGET_MB:-512}
      # Budget for one site's catalog load, and the gap between two passes over
      # the sites that did not load. A site that misses the budget is degraded.
      SITE_PRELOAD_TIMEOUT_SECONDS: ${SITE_PRELOAD_TIMEOUT_SECONDS:-30}
      SITE_RETRY_INTERVAL_SECONDS: ${SITE_RETRY_INTERVAL_SECONDS:-60}
      # The directory the three services exchange catalog snapshots through.
      CATALOG_CACHE_DIR: /app/data/catalogs
      # Only the api rebuilds a stale catalog. A build inside a served call
      # exceeds this container's ceiling, and the api saves what it refreshes
      # to the shared volume.
      CATALOG_REFRESH_ENABLED: "false"
      # Only the api syncs an embedding index. This process searches what the
      # api wrote.
      EMBEDDING_INDEX_SYNC_ENABLED: "false"
      # Jobs the worker runs in parallel, across every queue.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      # Age at which a job still in 'doing' is failed so its lock releases.
      WORKER_STALLED_JOB_TIMEOUT_SECONDS: ${WORKER_STALLED_JOB_TIMEOUT_SECONDS:-3600}
      # Silence after which a worker counts as dead and its jobs are failed.
      # The heartbeat runs in a thread of its own, so a running job cannot
      # widen the gap this has to clear.
      WORKER_DEAD_HEARTBEAT_SECONDS: ${WORKER_DEAD_HEARTBEAT_SECONDS:-60}
      # Seconds between the worker heartbeats.
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-5}
      # The veupathdb-wdk-mcp endpoint an assistant's declaration resolves to,
      # and the credential presented there. Set the same secret in this
      # deployment's WDK_MCP_SERVICE_TOKENS; an empty one admits nothing.
      PATHFINDER_WDK_MCP_URL: ${PATHFINDER_WDK_MCP_URL:-http://wdk-mcp:8100/mcp}
      PATHFINDER_WDK_MCP_TOKEN: ${PATHFINDER_WDK_MCP_TOKEN:-}
      # The veupathdb-research-mcp endpoint and its credential. An empty token
      # admits no research source, and the turn runs without those tools.
      PATHFINDER_RESEARCH_MCP_URL: ${PATHFINDER_RESEARCH_MCP_URL:-http://research-mcp:8110/mcp}
      PATHFINDER_RESEARCH_MCP_TOKEN: ${PATHFINDER_RESEARCH_MCP_TOKEN:-}
      # Every process that writes or matches a helper strategy reads the same
      # prefix. A process on the library default recognises none of them.
      VEUPATHDB_INTERNAL_STRATEGY_NAME_PREFIX: ${VEUPATHDB_INTERNAL_STRATEGY_NAME_PREFIX:-__pathfinder_internal__:}
    volumes:
      - ./apps/api/.pf-runs:/data/pf-runs
      - catalogs_cache:/app/data/catalogs

  wdk-mcp:
    # The server is its own repository, built at the release `apps/api` pins,
    # so the served tools and the imported ones are the same code.
    build:
      context: https://github.com/VEuPathDB/ai-wdk-mcp.git#v0.2.0a2
    restart: unless-stopped
    # The catalog budget bounds the on-demand per-site loads; the ceiling is
    # the backstop, so exhaustion kills this server and not its neighbours.
    mem_limit: 2g
    ports:
      - "${MCP_PORT:-8100}:8100"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8100/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VEUPATHDB_SITES_CONFIG: ${VEUPATHDB_SITES_CONFIG:-}
      VEUPATHDB_AUTH_TOKEN: ${VEUPATHDB_AUTH_TOKEN:-}
      VEUPATHDB_OAUTH_URL: ${VEUPATHDB_OAUTH_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      # Accounted megabytes of per-site catalogs and semantic indexes one
      # process holds before the least recently used site is evicted.
      SITE_CATALOG_BUDGET_MB: ${SITE_CATALOG_BUDGET_MB:-512}
      # The directory the three services exchange catalog snapshots through.
      CATALOG_CACHE_DIR: /app/data/catalogs
      # Only the api rebuilds a stale catalog. A build inside a served call
      # exceeds this container's ceiling, and the api saves what it refreshes
      # to the shared volume.
      CATALOG_REFRESH_ENABLED: "false"
      # Only the api syncs an embedding index. This process searches what the
      # api wrote.
      EMBEDDING_INDEX_SYNC_ENABLED: "false"
      # The URL a client reads the RFC 9728 document at. It must be reachable
      # by the client, not by this container.
      WDK_MCP_BASE_URL: ${WDK_MCP_BASE_URL:-http://localhost:8100}
      # Applications this server admits without a VEuPathDB user, as
      # "app_id:secret[,app_id:secret...]". Empty admits user bearers only.
      WDK_MCP_SERVICE_TOKENS: ${WDK_MCP_SERVICE_TOKENS:-}
      # This server creates helper strategies too, so it tags them with the
      # prefix the api and the worker match on.
      VEUPATHDB_INTERNAL_STRATEGY_NAME_PREFIX: ${VEUPATHDB_INTERNAL_STRATEGY_NAME_PREFIX:-__pathfinder_internal__:}
    volumes:
      - catalogs_cache:/app/data/catalogs

  research-mcp:
    # The second server of the same distribution, built from the same release
    # at its own target. It reads no account and opens no database.
    build:
      context: https://github.com/VEuPathDB/ai-wdk-mcp.git#v0.2.0a2
      target: research
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "${RESEARCH_MCP_PORT:-8110}:8110"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8110/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      # The URL a client reads the RFC 9728 document at. It must be reachable
      # by the client, not by this container.
      RESEARCH_MCP_BASE_URL: ${RESEARCH_MCP_BASE_URL:-http://localhost:8110}
      # Applications this server admits, as "app_id:secret[,app_id:secret...]".
      # Empty admits nothing.
      RESEARCH_MCP_SERVICE_TOKENS: ${RESEARCH_MCP_SERVICE_TOKENS:-}
      RESEARCH_MCP_S2_API_KEY: ${S2_API_KEY:-}
      # A mailbox Crossref reads out of the User-Agent, which routes the call
      # to its polite pool. Empty keeps the anonymous pool.
      RESEARCH_MCP_CROSSREF_MAILTO: ${RESEARCH_MCP_CROSSREF_MAILTO:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pathfinder}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  catalogs_cache:
