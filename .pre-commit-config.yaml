repos:
  # Ruff for API: pre-commit installs ruff so hooks work without `uv` on PATH
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        name: ruff check (api)
        args: [--config, apps/api/pyproject.toml, --fix]
        files: ^apps/api/
      - id: ruff-format
        name: ruff format (api)
        args: [--config, apps/api/pyproject.toml]
        files: ^apps/api/
  - repo: local
    hooks:
      - id: ruff-assistant-core
        name: ruff (assistant-core)
        entry: bash -c "cd assistant-platform/packages/assistant-core && $HOME/.local/bin/uv run ruff check src tests && $HOME/.local/bin/uv run ruff format --check src tests"
        language: system
        pass_filenames: false
        types: [python]
        files: ^assistant-platform/packages/assistant-core/
      - id: mypy-assistant-core
        name: mypy (assistant-core)
        entry: bash -c "cd assistant-platform/packages/assistant-core && $HOME/.local/bin/uv run mypy --strict src"
        language: system
        pass_filenames: false
        types: [python]
        files: ^assistant-platform/packages/assistant-core/
      - id: pytest-assistant-core
        name: pytest (assistant-core, no pathfinder installed)
        entry: bash -c "cd assistant-platform/packages/assistant-core && $HOME/.local/bin/uv run pytest"
        language: system
        pass_filenames: false
        types: [python]
        files: ^assistant-platform/packages/assistant-core/
        stages: [pre-push]
      - id: ruff-veupathdb-py
        name: ruff (veupathdb-py)
        entry: bash -c "cd veupathdb-py && $HOME/.local/bin/uv run ruff check src tests && $HOME/.local/bin/uv run ruff format --check src tests"
        language: system
        pass_filenames: false
        types: [python]
        files: ^veupathdb-py/
      - id: mypy-veupathdb-py
        name: mypy (veupathdb-py)
        entry: bash -c "cd veupathdb-py && $HOME/.local/bin/uv run mypy --strict src"
        language: system
        pass_filenames: false
        types: [python]
        files: ^veupathdb-py/
      - id: pytest-veupathdb-py
        name: pytest (veupathdb-py, no pathfinder installed)
        entry: bash -c "cd veupathdb-py && $HOME/.local/bin/uv run pytest tests/unit"
        language: system
        pass_filenames: false
        types: [python]
        files: ^veupathdb-py/
        stages: [pre-push]
      - id: knowledge-veupathdb-py
        name: check-knowledge + check-wdk-rules (veupathdb-py)
        entry: bash -c "cd veupathdb-py && node scripts/check-knowledge.mjs && node scripts/check-wdk-rules.mjs"
        language: system
        pass_filenames: false
        files: ^veupathdb-py/(docs/knowledge/|scripts/)
      - id: ruff-veupathdb-mcp
        name: ruff (veupathdb-mcp)
        entry: bash -c "cd veupathdb-mcp && $HOME/.local/bin/uv run ruff check src tests && $HOME/.local/bin/uv run ruff format --check src tests"
        language: system
        pass_filenames: false
        types: [python]
        files: ^veupathdb-mcp/
      - id: mypy-veupathdb-mcp
        name: mypy (veupathdb-mcp)
        entry: bash -c "cd veupathdb-mcp && $HOME/.local/bin/uv run mypy --strict src"
        language: system
        pass_filenames: false
        types: [python]
        files: ^veupathdb-mcp/
      - id: pytest-veupathdb-mcp
        name: pytest (veupathdb-mcp, no pathfinder installed)
        entry: bash -c "cd veupathdb-mcp && $HOME/.local/bin/uv run pytest tests/unit"
        language: system
        pass_filenames: false
        types: [python]
        files: ^veupathdb-mcp/
        stages: [pre-push]
      - id: ruff-mcp-conformance
        name: ruff (mcp-conformance)
        entry: bash -c "cd assistant-platform/packages/mcp-conformance && $HOME/.local/bin/uv run ruff check src tests"
        language: system
        pass_filenames: false
        types: [python]
        files: ^assistant-platform/packages/mcp-conformance/
      - id: mypy-mcp-conformance
        name: mypy (mcp-conformance)
        entry: bash -c "cd assistant-platform/packages/mcp-conformance && $HOME/.local/bin/uv run mypy --strict src"
        language: system
        pass_filenames: false
        types: [python]
        files: ^assistant-platform/packages/mcp-conformance/
      - id: pytest-mcp-conformance
        name: pytest (mcp-conformance, fixture servers on loopback)
        entry: bash -c "cd assistant-platform/packages/mcp-conformance && $HOME/.local/bin/uv run pytest"
        language: system
        pass_filenames: false
        types: [python]
        files: ^assistant-platform/packages/mcp-conformance/
        stages: [pre-push]
      - id: typecheck-assistant-client
        name: tsc --noEmit (assistant-client)
        entry: bash -c "cd assistant-platform/packages/assistant-client-ts && yarn typecheck"
        language: system
        pass_filenames: false
        files: ^(assistant-platform/packages/assistant-client-ts/|assistant-platform/PROTOCOL\.md)
      - id: prettier-assistant-client
        name: prettier (assistant-client)
        entry: bash -c "cd assistant-platform/packages/assistant-client-ts && yarn format:check"
        language: system
        pass_filenames: false
        files: ^assistant-platform/packages/assistant-client-ts/
      - id: eslint-assistant-client
        name: eslint (assistant-client)
        entry: bash -c "cd assistant-platform/packages/assistant-client-ts && yarn lint"
        language: system
        pass_filenames: false
        files: ^assistant-platform/packages/assistant-client-ts/
      - id: vitest-assistant-client
        name: vitest (assistant-client, protocol conformance)
        entry: bash -c "cd assistant-platform/packages/assistant-client-ts && yarn test"
        language: system
        pass_filenames: false
        files: ^(assistant-platform/packages/assistant-client-ts/|assistant-platform/PROTOCOL\.md)
        stages: [pre-push]
      - id: mypy-api
        name: mypy (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run --project . mypy src"
        language: system
        pass_filenames: false
        types: [python]
      - id: pyright-api
        name: pyright (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run pyright src/pathfinder"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
      - id: prettier-shared-ts
        name: prettier (shared-ts)
        entry: bash -c "cd packages/shared-ts && yarn format:check"
        language: system
        pass_filenames: false
        files: ^packages/shared-ts/
      - id: prettier-web
        name: prettier (web)
        entry: bash -c "cd apps/web && yarn format:check"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|assistant-platform/packages/assistant-client-ts/).*
      - id: eslint-web
        name: eslint (web)
        entry: bash -c "cd apps/web && yarn lint"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|assistant-platform/packages/assistant-client-ts/).*
      - id: typecheck-web
        name: tsc --noEmit (web)
        entry: bash -c "cd apps/web && yarn typecheck"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|assistant-platform/packages/assistant-client-ts/).*
      - id: boundaries-web
        name: check boundaries (web, and the checker)
        entry: bash -c "cd apps/web && yarn check:boundaries && node --test scripts/check-boundaries.test.mjs"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|assistant-platform/packages/assistant-client-ts/).*
      - id: weak-assertions-web
        name: weak-assertion check (web, and the checker)
        entry: bash -c "cd apps/web && yarn check:weak-assertions && node --test scripts/check-weak-assertions.test.mjs"
        language: system
        pass_filenames: false
        files: ^apps/web/.*
      - id: strict-mode-web
        name: index-based Playwright locator check (web)
        entry: bash -c "cd apps/web && yarn check:strict-mode"
        language: system
        pass_filenames: false
        files: ^apps/web/.*
      - id: knowledge-okf
        name: check knowledge bundle (OKF v0.2)
        entry: bash -c "node scripts/check-knowledge.mjs && node --test scripts/check-knowledge.test.mjs"
        language: system
        pass_filenames: false
        files: ^(docs/knowledge/|scripts/(check-knowledge\.(mjs|test\.mjs)|__fixtures__/knowledge/))
      - id: wdk-rules
        name: check WDK rules (anchors, citations, conformance)
        entry: bash -c "node scripts/check-wdk-rules.mjs && node --test scripts/check-wdk-rules.test.mjs"
        language: system
        pass_filenames: false
        files: ^(docs/|apps/|packages/|scripts/|veupathdb-py/)
      - id: vitest-web
        name: vitest (web)
        entry: bash -c "cd apps/web && yarn vitest run"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|assistant-platform/packages/assistant-client-ts/).*
        stages: [pre-push]
      - id: pytest-api
        name: pytest (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python -m pytest src/pathfinder/tests/unit/ -v"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [pre-push]
      - id: build-web
        name: next build (web)
        entry: bash -c "cd apps/web && NEXT_PUBLIC_API_URL='http://localhost:8000' yarn build"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|assistant-platform/packages/assistant-client-ts/).*
        stages: [pre-push]
      - id: openapi-check-api
        name: openapi spec freshness (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python -m pathfinder.devtools.openapi check"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
      - id: file-size-api
        name: file size check (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python scripts/check_max_lines.py"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
      - id: import-linter-api
        name: import-linter (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run lint-imports"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
      - id: vulture-api
        name: vulture (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run vulture"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
      - id: weak-assertions-api
        name: weak-assertion check (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python scripts/check_weak_assertions.py"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
      - id: pip-audit-api
        name: pip-audit (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run pip-audit"
        language: system
        pass_filenames: false
        files: ^apps/api/pyproject\.toml$
        stages: [pre-push]
      - id: shared-ts-openapi
        name: generated types freshness (shared-ts)
        entry: bash -c "cd packages/shared-ts && yarn check:generated"
        language: system
        pass_filenames: false
        files: ^(packages/shared-ts/|apps/api/).*
