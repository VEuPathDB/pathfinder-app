default_stages: [pre-commit]
repos:
  # Ruff for API: pre-commit installs ruff so hooks work without `uv` on PATH
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        name: ruff check (api)
        args: [--config, apps/api/pyproject.toml, --fix]
        files: ^apps/api/
      - id: ruff-format
        name: ruff format (api)
        args: [--config, apps/api/pyproject.toml]
        files: ^apps/api/
  - repo: local
    hooks:
      - id: mypy-api
        name: mypy (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run --project . mypy src"
        language: system
        pass_filenames: false
        types: [python]
        stages: [manual]
      - id: pyright-api
        name: pyright (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run pyright src/strategist src/strategist_scripted"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [manual]
      - id: prettier-shared-ts
        name: prettier (shared-ts, staged files)
        entry: bash -c 'cd packages/shared-ts && yarn prettier --check --ignore-unknown "${@#packages/shared-ts/}"' --
        language: system
        files: ^packages/shared-ts/
      - id: prettier-web
        name: prettier (web, staged files)
        entry: bash -c 'cd apps/web && yarn prettier --check --ignore-unknown "${@#apps/web/}"' --
        language: system
        files: ^apps/web/
      - id: eslint-web-staged
        name: eslint (web, staged files)
        entry: bash -c 'cd apps/web && yarn eslint --no-warn-ignored "${@#apps/web/}"' --
        language: system
        files: ^apps/web/.*\.(ts|tsx|js|jsx|mjs|cjs)$
      - id: eslint-web
        name: eslint (web)
        entry: bash -c "cd apps/web && yarn lint"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|packages/spec/).*
        stages: [manual]
      - id: typecheck-web
        name: tsc --noEmit (web)
        entry: bash -c "cd apps/web && yarn typecheck"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|packages/spec/).*
        stages: [manual]
      - id: boundaries-web
        name: check boundaries (web, and the checker)
        entry: bash -c "cd apps/web && yarn check:boundaries && node --test scripts/check-boundaries.test.mjs"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/).*
        stages: [manual]
      - id: redact-traces-web
        name: the trace redaction (web)
        entry: bash -c "cd apps/web && node --test scripts/redact-traces.test.mjs"
        language: system
        pass_filenames: false
        files: ^apps/web/scripts/redact-traces.*
        stages: [manual]
      - id: wire-recordings-web
        name: the per-test wire token (web)
        entry: bash -c "cd apps/web && node --test scripts/wire-recordings.test.mjs"
        language: system
        pass_filenames: false
        files: ^apps/web/(scripts/wire-recordings|e2e/fixtures/wire-recordings).*
        stages: [manual]
      - id: weak-assertions-web
        name: weak-assertion check (web, and the checker)
        entry: bash -c "cd apps/web && yarn check:weak-assertions && node --test scripts/check-weak-assertions.test.mjs"
        language: system
        pass_filenames: false
        files: ^apps/web/.*
        stages: [manual]
      - id: strict-mode-web
        name: index-based Playwright locator check (web)
        entry: bash -c "cd apps/web && yarn check:strict-mode"
        language: system
        pass_filenames: false
        files: ^apps/web/.*
        stages: [manual]
      - id: knowledge-okf
        name: check knowledge bundle (OKF v0.2)
        entry: bash -c "node scripts/check-knowledge.mjs && node --test scripts/check-knowledge.test.mjs"
        language: system
        pass_filenames: false
        files: ^(docs/knowledge/|scripts/(check-knowledge\.(mjs|test\.mjs)|__fixtures__/knowledge/))
        stages: [manual]
      - id: punctuation
        name: plain ASCII punctuation (source)
        entry: node scripts/check-punctuation.mjs
        language: system
        pass_filenames: false
        files: ^(apps/(api/src|web/src|web/e2e)/|packages/shared-ts/src/|scripts/)
      - id: punctuation-checker
        name: the punctuation checker
        entry: node --test scripts/check-punctuation.test.mjs
        language: system
        pass_filenames: false
        files: ^scripts/check-punctuation\.(mjs|test\.mjs)$
        stages: [manual]
      - id: vocabulary
        name: one name per concept (copy and model text, and the checker)
        entry: bash -c "node scripts/check-vocabulary.mjs && node --test scripts/check-vocabulary.test.mjs"
        language: system
        pass_filenames: false
        files: ^(apps/(api/src|web/src)/|docs/knowledge/conventions/vocabulary\.md$|scripts/check-vocabulary\.(mjs|test\.mjs)$)
        stages: [manual]
      - id: test-sites
        name: check the test sites
        entry: node scripts/check-test-sites.mjs
        language: system
        pass_filenames: false
        always_run: true
      - id: wire-recordings
        name: check the wire recordings
        entry: node scripts/check-wire-recordings.mjs
        language: system
        pass_filenames: false
        always_run: true
      - id: wire-recordings-checker
        name: the wire recordings checker
        entry: node --test scripts/check-wire-recordings.test.mjs
        language: system
        pass_filenames: false
        files: ^scripts/check-wire-recordings\.(mjs|test\.mjs)$
        stages: [manual]
      - id: test-sites-checker
        name: the test-sites checker
        entry: node --test scripts/check-test-sites.test.mjs
        language: system
        pass_filenames: false
        files: ^scripts/check-test-sites\.(mjs|test\.mjs)$
        stages: [manual]
      - id: release
        name: check the release pins (and the checker)
        entry: bash -c "node scripts/check-release.mjs && node --test scripts/check-release.test.mjs scripts/release.test.mjs"
        language: system
        pass_filenames: false
        files: ^(apps/api/pyproject\.toml|apps/api/src/strategist/__init__\.py|docker-compose\.yml|scripts/(check-)?release\.(mjs|test\.mjs))$
        stages: [manual]
      - id: wdk-rules
        name: check WDK rules (anchors, citations, conformance)
        entry: bash -c "node scripts/check-wdk-rules.mjs && node --test scripts/check-wdk-rules.test.mjs"
        language: system
        pass_filenames: false
        files: ^(docs/|apps/|packages/|scripts/)
        stages: [manual]
      - id: vitest-web
        name: vitest (web)
        entry: bash -c "cd apps/web && yarn vitest run --maxWorkers=3"
        language: system
        pass_filenames: false
        files: ^(apps/web/|packages/shared-ts/|packages/spec/).*
        stages: [manual]
      - id: pytest-api
        name: pytest (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python -m pytest src/strategist/tests/unit/ -n 4"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [manual]
      - id: openapi-check-api
        name: openapi spec freshness (api)
        entry: bash -c "cd apps/api && API_ENV=test API_SECRET_KEY=spec-generation-secret-key-0000000000 STRATEGIST_CHAT_PROVIDER=default ANTHROPIC_API_KEY=spec-generation-placeholder OPENAI_API_KEY=spec-generation-placeholder VEUPATHDB_SITES_CONFIG=../../deploy/sites/qa.yml DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/strategist $HOME/.local/bin/uv run python -m strategist.devtools.openapi check"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [manual]
      - id: file-size-api
        name: file size check (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python scripts/check_max_lines.py"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [manual]
      - id: import-linter-api
        name: import-linter (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run lint-imports"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [manual]
      - id: param-equality-api
        name: param-equality (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python -m veupathdb.devtools.param_equality src --allow scripts/param-equality-allowed.txt"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [manual]
      - id: vulture-api
        name: vulture (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run vulture"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [manual]
      - id: weak-assertions-api
        name: weak-assertion check (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python scripts/check_weak_assertions.py"
        language: system
        pass_filenames: false
        types: [python]
        files: ^apps/api/.*
        stages: [manual]
      - id: fail-open-api
        name: fail-open handler check (api)
        entry: bash -c "cd apps/api && $HOME/.local/bin/uv run python scripts/check_fail_open.py"
        language: system
        pass_filenames: false
        files: ^apps/api/(src/strategist/(ai|services|domain)/.*\.py|scripts/(check_fail_open\.py|fail-open-allowed\.txt))$
        stages: [manual]
      - id: shared-ts-openapi
        name: the committed spec generates types that compile (shared-ts)
        entry: bash -c "cd packages/shared-ts && yarn check:generated"
        language: system
        pass_filenames: false
        files: ^(packages/shared-ts/|packages/spec/|apps/api/).*
        stages: [manual]
      - id: pre-push-gates
        name: the whole-project gates, in parallel (scripts/pre-push.mjs)
        entry: node scripts/pre-push.mjs
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
