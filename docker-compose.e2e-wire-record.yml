# E2E record overlay, layered after docker-compose.e2e-wire.yml. wdk-wire
# forwards to QA and writes the recordings, so neither it nor the stack is
# fenced, the recordings directory is writable, and the account's real token
# is verified by the real OAuth server. Run it only on cedar, through
# scripts/e2e-wire.sh record.

services:
  wdk-wire:
    environment:
      WIRE_MODE: record
      WIRE_OAUTH_URL: ""
    extra_hosts: !reset []

  api:
    environment:
      VEUPATHDB_OAUTH_URL: ""
    extra_hosts: !reset []

  worker:
    environment:
      VEUPATHDB_OAUTH_URL: ""
    extra_hosts: !reset []
