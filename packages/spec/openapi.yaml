      - searchName
      - geneCount
      - uniqueCount
      - sampleUniqueGenes
      title: VariantResult
      type: object
    VerificationDigest:
      properties:
        disposition:
          $ref: '#/components/schemas/PhaseDisposition'
          description: 'Control-flow signal: ''done'' = investigation is complete; ''awaiting_user'' = the turn ends; ''handoff''
            = transition to the next sub-agent.'
        prose:
          description: User-facing assistant message shown in the chat thread.
          maxLength: 4000
          minLength: 1
          title: Prose
          type: string
        reason:
          description: Short routing explanation shown on the orchestrator card.
          maxLength: 280
          minLength: 1
          title: Reason
          type: string
        handoffTo:
          anyOf:
          - enum:
            - frame
            - build
            - verification
            type: string
          - type: 'null'
          title: Handoffto
        failureCause:
          anyOf:
          - $ref: '#/components/schemas/FailureCause'
          - type: 'null'
        noteRefs:
          items:
            type: string
          maxItems: 10
          title: Noterefs
          type: array
        success:
          description: 'True if the strategy answered the user''s question: sample records and result sizes look right, control
            tests passed.'
          title: Success
          type: boolean
        keyFindings:
          items:
            type: string
          maxItems: 10
          title: Keyfindings
          type: array
        caveats:
          items:
            type: string
          maxItems: 10
          title: Caveats
          type: array
        constraintReport:
          items:
            $ref: '#/components/schemas/ConstraintCheck'
          maxItems: 12
          title: Constraintreport
          type: array
        remember:
          description: Durable findings worth a later turn, each with a recall-friendly name such as "P. falciparum kinome
            size", counts or identifiers in its content, and tags naming an organism, a technique or a dataset. The site id
            is added automatically.
          items:
            $ref: '#/components/schemas/MemoryEntryDraft'
          maxItems: 5
          title: Remember
          type: array
      required:
      - disposition
      - prose
      - reason
      - success
      title: VerificationDigest
      type: object
    VerificationSection:
      properties:
        digest:
          anyOf:
          - $ref: '#/components/schemas/VerificationDigest'
          - type: 'null'
        complete:
          readOnly: true
          title: Complete
          type: boolean
        successful:
          readOnly: true
          title: Successful
          type: boolean
      required:
      - complete
      - successful
      title: VerificationSection
      type: object
