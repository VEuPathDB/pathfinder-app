            comparator, organism, record_type, percentile, combination, other. Captured fresh each turn from the literal message
            - these are user-explicit by construction and override scoping's provisional assumptions for the same dimension.
          items:
            $ref: '#/components/schemas/Constraint'
          title: Explicitconstraints
          type: array
      required:
      - rawText
      - classification
      - inferredGoal
      title: UserIntent
      type: object
    UserQuestionAnswer:
      description: 'The user''s answer to one ``ConsultQuestion``: chosen option label(s)

        and/or a free-text note. ``chosen_labels`` is empty for free_text.'
      properties:
        questionId:
          title: Questionid
          type: string
        prompt:
