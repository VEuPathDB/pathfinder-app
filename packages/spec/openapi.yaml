components:
  schemas:
    AddCombineOp:
      properties:
        kind:
          type: string
          const: addCombine
          title: Kind
          default: addCombine
        step:
          $ref: '#/components/schemas/StrategyStepNode'
        leftId:
          type: string
          title: Leftid
        rightId:
          type: string
          title: Rightid
      type: object
      required:
      - step
      - leftId
      - rightId
      title: AddCombineOp
    AddLeafOp:
      properties:
        kind:
          type: string
          const: addLeaf
          title: Kind
          default: addLeaf
        step:
          $ref: '#/components/schemas/StrategyStepNode'
        attach:
          oneOf:
          - $ref: '#/components/schemas/AttachNewRoot'
          - $ref: '#/components/schemas/AttachIntoSlot'
          title: Attach
          discriminator:
            propertyName: mode
            mapping:
              into-slot: '#/components/schemas/AttachIntoSlot'
              new-root: '#/components/schemas/AttachNewRoot'
      type: object
      required:
      - step
      - attach
      title: AddLeafOp
    AddTransformOp:
      properties:
        kind:
          type: string
          const: addTransform
          title: Kind
          default: addTransform
        step:
          $ref: '#/components/schemas/StrategyStepNode'
        inputId:
          type: string
          title: Inputid
        mode:
          type: string
          enum:
          - before-consumer
          - new-root
          title: Mode
      type: object
      required:
      - step
      - inputId
      - mode
      title: AddTransformOp
    ApplyOperationRequest:
      properties:
        op:
          oneOf:
          - $ref: '#/components/schemas/AddLeafOp'
          - $ref: '#/components/schemas/AddCombineOp'
          - $ref: '#/components/schemas/AddTransformOp'
          - $ref: '#/components/schemas/DuplicateStepOp'
          - $ref: '#/components/schemas/DeleteStepOp'
          - $ref: '#/components/schemas/DeleteEdgeOp'
          - $ref: '#/components/schemas/ReplaceSubtreeOp'
          - $ref: '#/components/schemas/UpdateStepParamsOp'
          - $ref: '#/components/schemas/UpdateCombineOperatorOp'
          - $ref: '#/components/schemas/UpdateStepMetaOp'
          - $ref: '#/components/schemas/UpdateStrategyMetaOp'
          - $ref: '#/components/schemas/WireInputOp'
          - $ref: '#/components/schemas/ReplaceStrategyOp'
          title: Op
          discriminator:
            propertyName: kind
            mapping:
              addCombine: '#/components/schemas/AddCombineOp'
              addLeaf: '#/components/schemas/AddLeafOp'
              addTransform: '#/components/schemas/AddTransformOp'
              deleteEdge: '#/components/schemas/DeleteEdgeOp'
              deleteStep: '#/components/schemas/DeleteStepOp'
              duplicateStep: '#/components/schemas/DuplicateStepOp'
              replaceStrategy: '#/components/schemas/ReplaceStrategyOp'
              replaceSubtree: '#/components/schemas/ReplaceSubtreeOp'
              updateCombineOperator: '#/components/schemas/UpdateCombineOperatorOp'
              updateStepMeta: '#/components/schemas/UpdateStepMetaOp'
              updateStepParams: '#/components/schemas/UpdateStepParamsOp'
              updateStrategyMeta: '#/components/schemas/UpdateStrategyMetaOp'
              wireInput: '#/components/schemas/WireInputOp'
      type: object
      required:
      - op
      title: ApplyOperationRequest
    AttachIntoSlot:
      properties:
        mode:
          type: string
          const: into-slot
          title: Mode
          default: into-slot
        targetStepId:
          type: string
          title: Targetstepid
        slot:
          type: string
          enum:
          - primary
          - secondary
          title: Slot
      type: object
      required:
      - targetStepId
      - slot
      title: AttachIntoSlot
    AttachNewRoot:
      properties:
        mode:
          type: string
          const: new-root
          title: Mode
          default: new-root
      type: object
      title: AttachNewRoot
    AttributesResponse:
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/RecordAttribute'
          type: array
          title: Attributes
        recordType:
          type: string
          title: Recordtype
      type: object
      required:
      - attributes
      - recordType
      title: AttributesResponse
    AuthStatusResponse:
      properties:
        signedIn:
          type: boolean
          title: Signedin
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
      type: object
      required:
      - signedIn
      title: AuthStatusResponse
      description: Current auth status response.
    AuthSuccessResponse:
      properties:
        success:
          type: boolean
          title: Success
      type: object
      required:
      - success
      title: AuthSuccessResponse
      description: Success response. Auth token is set via httpOnly cookie only.
    BatchOrganismTargetRequest:
      properties:
        organism:
          type: string
          title: Organism
        positiveControls:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Positivecontrols
        negativeControls:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Negativecontrols
      type: object
      required:
      - organism
      title: BatchOrganismTargetRequest
      description: Per-organism override for a cross-organism batch experiment.
    BeginConversationRequest:
      properties:
        siteId:
          type: string
          maxLength: 50
          minLength: 1
          title: Siteid
        experimentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Experimentid
        seedText:
          anyOf:
          - type: string
            maxLength: 4000
          - type: 'null'
          title: Seedtext
        assistantId:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Assistantid
      type: object
      required:
      - siteId
      title: BeginConversationRequest
    BeginConversationResponse:
      properties:
        conversationId:
          type: string
          format: uuid
          title: Conversationid
        isNew:
          type: boolean
          title: Isnew
        name:
          type: string
          title: Name
      type: object
      required:
      - conversationId
      - isNew
      - name
      title: BeginConversationResponse
    BenchmarkControlSet:
      properties:
        label:
          type: string
          minLength: 1
          title: Label
        positiveControls:
          items:
            type: string
          type: array
          title: Positivecontrols
        negativeControls:
          items:
            type: string
          type: array
          title: Negativecontrols
        controlSetId:
          anyOf:
          - type: string
          - type: 'null'
          title: Controlsetid
        isPrimary:
          type: boolean
          title: Isprimary
          default: false
      type: object
      required:
      - label
      - positiveControls
      - negativeControls
      title: BenchmarkControlSet
      description: A single control set within a benchmark suite.
    BuildGoldRequest:
      properties:
        goldId:
          type: string
          title: Goldid
        siteId:
          type: string
          maxLength: 50
          minLength: 1
          title: Siteid
        recordType:
          type: string
          title: Recordtype
          default: gene
        stepTree:
          additionalProperties: true
          type: object
          title: Steptree
        datasetGeneIds:
          anyOf:
          - additionalProperties:
              items:
                type: string
              type: array
            type: object
          - type: 'null'
          title: Datasetgeneids
      type: object
      required:
      - goldId
      - siteId
      - stepTree
      title: BuildGoldRequest
      description: Request to materialize a gold strategy AST on WDK and return gene IDs.
    BuildGoldResponse:
      properties:
        goldId:
          type: string
          title: Goldid
        wdkStrategyId:
          type: integer
          title: Wdkstrategyid
        rootStepId:
          type: integer
          title: Rootstepid
        estimatedSize:
          type: integer
          title: Estimatedsize
        geneIds:
          items:
            type: string
          type: array
          title: Geneids
        conversationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversationid
      type: object
      required:
      - goldId
      - wdkStrategyId
      - rootStepId
      - estimatedSize
      - geneIds
      title: BuildGoldResponse
    ChatRequestBody:
      properties:
        trigger:
          type: string
          enum:
          - submit-message
          - regenerate-message
          title: Trigger
          default: submit-message
        id:
          type: string
          title: Id
          default: ''
        messages:
          items:
            $ref: '#/components/schemas/UIMessage'
          type: array
          title: Messages
        conversationId:
          type: string
          format: uuid
          title: Conversationid
        assistantId:
          anyOf:
          - type: string
          - type: 'null'
          title: Assistantid
        siteId:
          type: string
          maxLength: 50
          title: Siteid
          default: ''
        mode:
          type: string
          title: Mode
          default: strategy
        experimentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Experimentid
        phaseModels:
          additionalProperties:
            type: string
          type: object
          title: Phasemodels
        phaseReasoning:
          additionalProperties:
            $ref: '#/components/schemas/ReasoningEffort'
          type: object
          title: Phasereasoning
      type: object
      required:
      - conversationId
      title: ChatRequestBody
      description: 'Typed body for ``POST /api/v1/chat`` (AI SDK v6 + PathFinder extras).


        The shape matches ``@ai-sdk/react``''s ``useChat`` submit payload

        (``trigger``, ``id``, ``messages``) with PathFinder-scoped fields

        (``conversationId``, ``siteId``, ``mode``, ``experimentId``) layered on

        via ``body`` on the client transport. The authenticated user UUID still

        comes from the ``pathfinder-auth`` cookie. ``messages`` uses pydantic-ai''s

        ``UIMessage`` so deferred-tool approval-responded parts deserialize into

        the discriminated union and ``iter_tool_approval_responses`` works.'
    Classification:
      type: string
      enum:
      - TP
      - FP
      - FN
      - TN
    ClassifiedRecord:
      properties:
        displayName:
          type: string
          title: Displayname
        id:
          items:
            $ref: '#/components/schemas/WDKRecordIdPart'
          type: array
          title: Id
        recordClassName:
          type: string
          title: Recordclassname
        attributes:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          type: object
          title: Attributes
        tables:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          type: object
          title: Tables
        tableErrors:
          items:
            type: string
          type: array
          title: Tableerrors
        classification:
          anyOf:
          - $ref: '#/components/schemas/Classification'
          - type: 'null'
      type: object
      required:
      - displayName
      - id
      - recordClassName
      - attributes
      - tables
      - tableErrors
      title: ClassifiedRecord
      description: WDK record plus optional TP/FP/FN/TN tag from experiment classification.
    ColocationParams:
      properties:
        operation:
          type: string
          enum:
          - overlaps
          - contains
          - is contained in
          title: Operation
          default: overlaps
        strand:
          type: string
          enum:
          - either strand
          - same strand
          - opposite strand
          title: Strand
          default: either strand
        output:
          type: string
          enum:
          - a
          - b
          title: Output
          default: a
        regionA:
          type: string
          enum:
          - exact
          - upstream
          - downstream
          - custom
          title: Regiona
          default: custom
        beginA:
          type: string
          enum:
          - start
          - stop
          title: Begina
          default: start
        beginDirectionA:
          type: string
          enum:
          - +
          - '-'
          title: Begindirectiona
          default: '-'
        beginOffsetA:
          type: integer
          minimum: 0.0
          title: Beginoffseta
          default: 1000
        endA:
          type: string
          enum:
          - start
          - stop
          title: Enda
          default: stop
        endDirectionA:
          type: string
          enum:
          - +
          - '-'
          title: Enddirectiona
          default: +
        endOffsetA:
          type: integer
          minimum: 0.0
          title: Endoffseta
          default: 0
        regionB:
          type: string
          enum:
          - exact
          - upstream
          - downstream
          - custom
          title: Regionb
          default: exact
        beginB:
          type: string
          enum:
          - start
          - stop
          title: Beginb
          default: start
        beginDirectionB:
          type: string
          enum:
          - +
          - '-'
          title: Begindirectionb
          default: +
        beginOffsetB:
          type: integer
          minimum: 0.0
          title: Beginoffsetb
          default: 0
        endB:
          type: string
          enum:
          - start
          - stop
          title: Endb
          default: stop
        endDirectionB:
          type: string
          enum:
          - +
          - '-'
          title: Enddirectionb
          default: +
        endOffsetB:
          type: integer
          minimum: 0.0
          title: Endoffsetb
          default: 0
      type: object
      title: ColocationParams
      description: 'Span-logic parameters for the COLOCATE operator.


        Field values are readable words. Serialization translates them to the WDK

        vocabulary values.'
    CombineOp:
      type: string
      enum:
      - INTERSECT
      - MINUS
      - RMINUS
      - LONLY
      - RONLY
      - COLOCATE
      - UNION
      title: CombineOp
      description: 'Set operations that combine two step results.


        WDK defines the same set. LONLY matches MINUS and RONLY matches RMINUS.

        Both names stay, for round-trip fidelity with WDK.'
    ControlSetResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        siteId:
          type: string
          title: Siteid
        recordType:
          type: string
          title: Recordtype
        positiveIds:
          items:
            type: string
          type: array
          title: Positiveids
        negativeIds:
          items:
            type: string
          type: array
          title: Negativeids
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
        tags:
          items:
            type: string
          type: array
          title: Tags
        provenanceNotes:
          anyOf:
          - type: string
          - type: 'null'
          title: Provenancenotes
        version:
