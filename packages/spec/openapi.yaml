            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
      security:
      - APIKeyCookie: []
      - HTTPBearer: []
      - APIKeyHeader: []
