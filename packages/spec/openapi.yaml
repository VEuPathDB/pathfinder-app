    ExperimentConfig:
      description: 'Full configuration for an experiment run.


        Supports three modes:


        * **single** (default): one search + parameters.

        * **multi-step**: a recursive ``step_tree`` of search/combine/transform nodes.

        * **import**: import an existing Pathfinder strategy by ``source_strategy_id``.'
      properties:
        siteId:
          title: Siteid
          type: string
        recordType:
          title: Recordtype
          type: string
        searchName:
          title: Searchname
          type: string
        parameters:
          additionalProperties:
            discriminator:
              mapping:
                date: '#/components/schemas/DateValue'
                date-range: '#/components/schemas/DateRangeValue'
                filter: '#/components/schemas/FilterValue'
                input-dataset: '#/components/schemas/InputDatasetValue'
                input-step: '#/components/schemas/InputStepValue'
                multi-pick-vocabulary: '#/components/schemas/MultiPickValue'
                number: '#/components/schemas/NumberValue'
                number-range: '#/components/schemas/NumberRangeValue'
                single-pick-vocabulary: '#/components/schemas/SinglePickValue'
                string: '#/components/schemas/StringValue'
                timestamp: '#/components/schemas/TimestampValue'
              propertyName: type
            oneOf:
            - $ref: '#/components/schemas/StringValue'
            - $ref: '#/components/schemas/NumberValue'
            - $ref: '#/components/schemas/NumberRangeValue'
            - $ref: '#/components/schemas/DateValue'
            - $ref: '#/components/schemas/DateRangeValue'
            - $ref: '#/components/schemas/TimestampValue'
            - $ref: '#/components/schemas/SinglePickValue'
            - $ref: '#/components/schemas/MultiPickValue'
            - $ref: '#/components/schemas/FilterValue'
            - $ref: '#/components/schemas/InputDatasetValue'
            - $ref: '#/components/schemas/InputStepValue'
          title: Parameters
          type: object
        positiveControls:
          items:
            type: string
          title: Positivecontrols
          type: array
        negativeControls:
          items:
            type: string
          title: Negativecontrols
          type: array
        controlsSearchName:
          title: Controlssearchname
          type: string
        controlsParamName:
          title: Controlsparamname
          type: string
        controlsValueFormat:
          default: newline
          enum:
          - newline
          - json_list
          - comma
          title: Controlsvalueformat
          type: string
        enableCrossValidation:
          default: false
          title: Enablecrossvalidation
          type: boolean
        kFolds:
          default: 5
          title: Kfolds
          type: integer
        enrichmentTypes:
          items:
            $ref: '#/components/schemas/EnrichmentAnalysisType'
          title: Enrichmenttypes
          type: array
        name:
          default: ''
          title: Name
          type: string
        description:
          default: ''
          title: Description
          type: string
        parameterDisplayValues:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Parameterdisplayvalues
        mode:
          default: single
          enum:
          - single
          - multi-step
          - import
          title: Mode
          type: string
        stepTree:
          anyOf:
          - $ref: '#/components/schemas/StrategyStepNode'
          - type: 'null'
        sourceStrategyId:
          anyOf:
          - type: string
          - type: 'null'
          title: Sourcestrategyid
        controlSetId:
          anyOf:
          - type: string
          - type: 'null'
          title: Controlsetid
        maxListSize:
          anyOf:
          - type: integer
          - type: 'null'
          title: Maxlistsize
        parentExperimentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Parentexperimentid
        targetGeneIds:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Targetgeneids
      required:
      - siteId
      - recordType
      - searchName
      - parameters
      - positiveControls
      - negativeControls
      - controlsSearchName
      - controlsParamName
      title: ExperimentConfig
      type: object
