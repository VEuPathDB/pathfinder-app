          type: string
        chosenLabels:
          items:
            type: string
          title: Chosenlabels
          type: array
        note:
          default: ''
          title: Note
          type: string
      required:
      - questionId
      - prompt
      title: UserQuestionAnswer
      type: object
    VariantComparison:
      properties:
