          title: Ispublic
        userId:
          anyOf:
          - type: string
          - type: 'null'
          title: Userid
        createdAt:
          type: string
          title: Createdat
      type: object
      required:
      - id
      - name
      - siteId
      - recordType
      - positiveIds
      - negativeIds
      - tags
      - version
      - isPublic
      - createdAt
      title: ControlSetResponse
      description: Serialized control set returned to the client.
