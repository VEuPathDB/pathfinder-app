openapi: 3.1.0
info:
  title: Pathfinder API
  description: VEuPathDB Strategy Builder Chatbot API
  version: 0.2.0a1
paths:
  /health:
    get:
      tags:
      - health
      summary: Health Check
      description: Liveness check - is the service running?
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/config:
    get:
      tags:
      - health
      summary: System Config
      description: 'Report whether the system has LLM provider keys configured.


        This is unauthenticated so the frontend can show a setup-required

        screen before asking users to log in.'
      operationId: system_config_health_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemConfigResponse'
  /health/system:
    get:
      tags:
      - health
      summary: System Ready
      description: 'Aggregate readiness for the UI startup gate: API subsystems + worker.


        Always returns 200 so the frontend can poll a single endpoint and read

        ``ready`` to decide whether to show the startup loader. Unlike

        ``/health/ready`` (the API container''s own healthcheck), worker liveness

        is included here — the worker is a sibling process, so its death must not

        flip the API''s container health.'
      operationId: system_ready_health_system_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemReadyResponse'
  /health/ready:
    get:
      tags:
      - health
      summary: Readiness Check
      description: 'Readiness check - can this process serve requests?


        Returns 503 until every process subsystem is ready (database, embedding

        model, PIGuard, graph checkpointer) and at least one site catalog is

        loaded. ``degraded`` names the sites whose catalog is not loaded; they are

        refused on their own routes and retried in the background. Also

        re-verifies the DB with a live ping so stale state does not mask a broken

        dependency.'
      operationId: readiness_check_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /api/v1/sites:
    get:
      tags:
      - sites
      summary: List Sites
      description: List every VEuPathDB site, and say which ones answer.
      operationId: list_sites_api_v1_sites_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SiteResponse'
                type: array
                title: Response List Sites Api V1 Sites Get
  /api/v1/sites/{siteId}/record-types:
    get:
      tags:
      - sites
      summary: Get Record Types
      description: Get record types available on a site.
      operationId: get_record_types_api_v1_sites__siteId__record_types_get
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 50
          title: Siteid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordTypeResponse'
                title: Response Get Record Types Api V1 Sites  Siteid  Record Types Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  /api/v1/sites/{siteId}/searches:
    get:
      tags:
      - sites
      summary: Get Searches
      description: Get searches available on a site, optionally filtered by record type.
      operationId: get_searches_api_v1_sites__siteId__searches_get
      parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 50
          title: Siteid
      - name: recordType
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Recordtype
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchResponse'
                title: Response Get Searches Api V1 Sites  Siteid  Searches Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
