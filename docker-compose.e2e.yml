# E2E overlay. The suite runs only on recorded WDK answers
# (docs/knowledge/decisions/e2e-replays-recorded-wdk.md): the wdk-wire proxy
# sits between the stack and every VEuPathDB host, answers from
# apps/web/e2e/wire/, and refuses any request it holds no recording for. api
# and worker reach WDK, EDA and VDI only through it, and it serves the key the
# suite's tokens are verified with. Playwright's global setup refuses to start
# unless wdk-wire answers its health route in replay mode.
#
# The fence maps every host the stack may call to 127.0.0.1, so a client that
# ignores the proxy settings gets a refused connection. The record overlay
# (docker-compose.e2e-wire-record.yml) drops it; only scripts/e2e-wire.sh
# record, refresh and catalogs layer it.
#
# The api runs the mock chat provider, so the dev-login endpoint is available,
# and the DB maps to port 5433 to avoid conflicts with a local PostgreSQL.
#
# The web service serves the production build. `next dev` compiles a route on
# every first request and keeps the compiled graph, so a suite that visits
# every route exhausts the host's memory; the production server also paints no
# dev overlay over the controls a spec clicks.
#
# `.env.test` sets OPENAI_API_KEY, which the stack does not start without. A
# key that is not a real one makes every Decisions call fail, and a read the
# service does not answer is the read it was.
#
# Usage: scripts/e2e-wire.sh replay
#
# CI builds the three images once, loads them on every shard runner, and starts
# the stack with --no-build, so the image names below are what a shard runs.

x-fence: &fence
  - "qa.veupathdb.org:127.0.0.1"
  - "qa.plasmodb.org:127.0.0.1"
  - "qa.toxodb.org:127.0.0.1"
  - "qa.cryptodb.org:127.0.0.1"
  - "qa.tritrypdb.org:127.0.0.1"
  - "qa.fungidb.org:127.0.0.1"
  - "qa.vectorbase.org:127.0.0.1"
  - "api.openai.com:127.0.0.1"

x-through-the-wire: &through-the-wire
  HTTPS_PROXY: http://wdk-wire:8080
  https_proxy: http://wdk-wire:8080
  NO_PROXY: localhost,127.0.0.1,db,api,worker,web,wdk-wire,wdk-mcp,research-mcp,searxng
  no_proxy: localhost,127.0.0.1,db,api,worker,web,wdk-wire,wdk-mcp,research-mcp,searxng
  SSL_CERT_FILE: /wire/ca/mitmproxy-ca-cert.pem
  # Tokens are verified against the key wdk-wire makes when it starts, which
  # it serves on this name only.
  VEUPATHDB_OAUTH_URL: https://auth.wire.test
  # A snapshot older than its TTL is served and never rebuilt.
  CATALOG_REFRESH_ENABLED: "false"

x-after-the-wire: &after-the-wire
  wdk-wire:
    condition: service_healthy
  catalogs-init:
    condition: service_completed_successfully

services:
  wdk-wire:
    image: strategist-e2e-wire:ci
    pull_policy: never
    build:
      context: ./deploy/wdk-wire
      args:
        VEUPATHDB_PY_REF: ${WIRE_VEUPATHDB_PY_REF:-v0.9.0b20}
    environment:
      WIRE_MODE: replay
      WIRE_OAUTH_URL: https://auth.wire.test
    volumes:
      - ${WIRE_DIR:-./apps/web/e2e/wire}:/wire/recordings:ro
      - ./e2e-sites.yaml:/wire/sites.yaml:ro
      - wire_ca:/wire/ca
    # The signing key and begin and end are served here; only loopback reaches it.
    ports:
      - "127.0.0.1:8181:8080"
    extra_hosts: *fence
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/__wire/health')"]
      interval: 2s
      timeout: 5s
      retries: 30

  catalogs-init:
    image: strategist-e2e-api:ci
    pull_policy: never
    restart: "no"
    entrypoint: ["python", "-c"]
    command:
      - |
        import gzip, pathlib
        source = pathlib.Path("/wire/recordings/catalogs")
        for packed in sorted(source.glob("*.json.gz")):
            target = pathlib.Path("/app/data/catalogs") / packed.name.removesuffix(".gz")
            target.write_bytes(gzip.decompress(packed.read_bytes()))
            print(f"unpacked {target.name}")
    volumes:
      - ${WIRE_DIR:-./apps/web/e2e/wire}:/wire/recordings:ro
      - catalogs_cache:/app/data/catalogs

  api:
    image: strategist-e2e-api:ci
    pull_policy: never
    build:
      target: e2e
    environment:
      <<: *through-the-wire
      API_ENV: test
      STRATEGIST_CHAT_PROVIDER: mock
      # The suite carries no API key, so every vector is the deterministic one.
      EMBEDDING_BACKEND: fake
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/strategist_test
      # The suite drives only the sites this file lists; warming the other
      # catalogs would only slow the boot.
      VEUPATHDB_SITES_CONFIG: /app/e2e-sites.yaml
      MAX_TURNS_IN_FLIGHT_PER_USER: "8"
      # The memory specs read what a turn writes, so every suite account remembers.
      MEMORY_ON_BY_DEFAULT: "true"
    volumes:
      - ./e2e-sites.yaml:/app/e2e-sites.yaml:ro
      - wire_ca:/wire/ca:ro
    extra_hosts: *fence
    depends_on: *after-the-wire
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  worker:
    image: strategist-e2e-api:ci
    pull_policy: never
    build:
      target: e2e
    environment:
      <<: *through-the-wire
      API_ENV: test
      STRATEGIST_CHAT_PROVIDER: mock
      EMBEDDING_BACKEND: fake
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/strategist_test
      VEUPATHDB_SITES_CONFIG: /app/e2e-sites.yaml
      # The measured capacity of one runner at two Playwright workers
      # (docs/knowledge/decisions/the-e2e-stack-serves-the-production-build.md).
      WORKER_CONCURRENCY: "8"
      MEMORY_ON_BY_DEFAULT: "true"
    volumes:
      - ./e2e-sites.yaml:/app/e2e-sites.yaml:ro
      - wire_ca:/wire/ca:ro
    extra_hosts: *fence
    depends_on: *after-the-wire

  web:
    image: strategist-e2e-web:ci
    pull_policy: never
    build:
      target: runner
    # The image's own check, polled every 5 s so `up --wait` returns soon
    # after the first render.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/strategist/').then(r => r.ok ? r.text() : Promise.reject(new Error(r.status))).then(() => process.exit(0), () => process.exit(1))\""]
      interval: 5s
      timeout: 30s
      retries: 10
      start_period: 60s

  db:
    environment:
      POSTGRES_DB: strategist_test
    ports: !override
      - "5433:5432"

volumes:
  wire_ca:
