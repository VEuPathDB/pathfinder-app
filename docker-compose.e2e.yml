# E2E testing override.
#
# Forces mock chat provider so the dev-login endpoint is available,
# and maps the DB to port 5433 to avoid conflicts with local PostgreSQL.
#
# The web service serves the production build. `next dev` compiles a route on
# every first request and keeps the compiled graph, so a suite that visits
# every route exhausts the host's memory; the production server also paints no
# dev overlay over the controls a spec clicks.
#
# VEuPathDB refuses guest service calls, so the Playwright process needs the
# registered account's WDK token in its own shell as WDK_TEST_TOKEN. Playwright
# sends it as the browser's Authorization cookie; no container reads it.
#
# Usage:
#   docker compose --env-file .env.test \
#     -f docker-compose.yml \
#     -f docker-compose.dev.yml \
#     -f docker-compose.e2e.yml \
#     up -d --build --wait api worker web
#   cd apps/web && export WDK_TEST_TOKEN=... && yarn test:e2e

services:
  api:
    environment:
      API_ENV: test
      PATHFINDER_CHAT_PROVIDER: mock
      # The suite carries no API key, so every vector is the deterministic one.
      EMBEDDING_BACKEND: fake
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pathfinder_test
      # The suite drives the portal plus five component sites; warming the
      # other catalogs would only slow the boot.
      VEUPATHDB_SITES_CONFIG: /app/e2e-sites.yaml
    volumes:
      - ./e2e-sites.yaml:/app/e2e-sites.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    environment:
      API_ENV: test
      PATHFINDER_CHAT_PROVIDER: mock
      EMBEDDING_BACKEND: fake
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pathfinder_test
      VEUPATHDB_SITES_CONFIG: /app/e2e-sites.yaml
    volumes:
      - ./e2e-sites.yaml:/app/e2e-sites.yaml:ro

  web:
    build:
      # Overrides the dev overlay's `dev` target when both files are layered.
      target: runner

  db:
    environment:
      POSTGRES_DB: pathfinder_test
    ports:
      - "5433:5432"
