# Tracing wiring for a deployment that runs Langfuse elsewhere.
#
# The api and the worker export every trace over OTLP/HTTP to the endpoint named
# here; the worker runs every model call, so both need it. The Authorization
# header Langfuse reads is built from the two project keys.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d

x-tracing: &tracing
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_INCLUDE_CONTENT: ${OTEL_INCLUDE_CONTENT:-false}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}

services:
  api:
    environment: *tracing
  worker:
    environment: *tracing
